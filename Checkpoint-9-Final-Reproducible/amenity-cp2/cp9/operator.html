<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amenity Decision Intelligence — Similar Cases</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17372f;background:#f5f7f4;line-height:1.55}*{box-sizing:border-box}body{margin:0}header{background:#173f34;color:white;padding:22px max(24px,calc((100vw - 1160px)/2))}header strong{font-size:21px}header p{margin:3px 0;color:#ccddd2;font-size:13px}nav{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}button,a.button{font:inherit;cursor:pointer;border:1px solid #cad6cd;background:white;color:#214d3a;border-radius:8px;padding:9px 14px;text-decoration:none}nav button{background:transparent;color:white;border-color:#698479}nav button.active{background:#e0eaca;color:#183d2e}main{max-width:1160px;margin:28px auto;padding:0 24px 60px}h1{font-size:32px;line-height:1.2;margin:10px 0}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0}.small{font-size:12px;color:#65766b}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#647768}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dbe3d9;border-radius:13px;padding:24px;margin:18px 0}.current{border-left:5px solid #46785d}.historical{border-top:4px solid #a1b778}.badge{display:inline-block;border-radius:20px;background:#e6efdb;padding:5px 11px;font-size:12px;font-weight:650}.warning{background:#fff1d4;color:#755315}.danger{background:#fbe9e5;color:#8a3324}.notice{padding:15px;border-radius:9px;background:#edf2e8;margin:12px 0}.notice.danger{background:#fbe9e5}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#f2f5ee;border-radius:9px;padding:14px 18px;min-width:120px}.stat strong{display:block;font-size:28px}.counts{display:flex;gap:20px;flex-wrap:wrap}.counts span{padding:7px 0}.case{border:1px solid #dbe3d9;border-radius:10px;padding:20px;margin:12px 0}.case.breach{border-left:5px solid #b75a3f}details{margin-top:12px}summary{cursor:pointer;font-weight:600}pre{background:#f2f4f1;padding:14px;overflow:auto;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px}table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}th,td{text-align:left;border-bottom:1px solid #dce3da;padding:10px;vertical-align:top}.qa-list{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#65766b}ul{padding-left:22px}footer{padding:20px;color:#65766b;text-align:center;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:0 15px 40px}h1{font-size:26px}.panel{padding:18px}.stat{min-width:100px}table{display:block;overflow:auto}}
</style></head><body><header><strong>Amenity Decision Intelligence</strong><p>From signals to safer intervention decisions.</p><nav><button data-route="product">Product Demo</button><button data-route="qa">Technical QA</button><button data-route="validation">Retrieval validation</button></nav></header><main id="app"></main><footer>Simulated historical evidence · Read-only review · Execution remains outside this interface</footer>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('review-data').textContent),app=document.getElementById('app');let page=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const raw=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
function badge(v){return '<span class="badge '+(/breach|concern|Blocked/.test(v)?'danger':/Insufficient|Mixed|Not comparable/.test(v)?'warning':'')+'">'+esc(v)+'</span>';}
function protectionContext(c){return '<p><strong>Protected function:</strong> '+esc(c.protectedFunction)+'</p><p class="small">Accessibility context: '+esc(c.protectionContext?.accessibilityNeeds??'Unknown')+'</p><details><summary>Dependency and realistic-substitute context</summary>'+raw(c.protectionContext)+'</details>';}
function casesCard(c){return '<article class="case '+(c.outcome.protection.state==='Protection breach'?'breach':'')+'"><div class="small">'+esc(c.disclosure)+'</div><h3>'+esc(c.label)+'</h3><div class="counts"><span>Goal: '+badge(c.outcome.goal.state)+'</span><span>Protection: '+badge(c.outcome.protection.state)+'</span></div>'+protectionContext(c)+(c.outcome.evidenceGeneration?'<p>Evidence-generation purpose: '+esc(c.outcome.evidenceGeneration)+'</p>':'')+'<p class="small">Execution: '+esc(c.outcome.execution.state)+'</p><details><summary>Why comparable — and what differs?</summary><p>Same reviewed '+esc(c.whySimilar.join(', '))+'.</p><p><strong>Decision-time context</strong><br>'+esc(c.historicalExcerpt)+'</p><p>Important structured differences: '+esc(c.differences.length?c.differences.join(', '):'None recorded in compared fields. Narrative context can still differ; inspect source evidence.')+'</p><p class="small">'+esc(c.cannotConclude)+'</p></details><details><summary>Inspect source case and outcome evidence</summary>'+raw({source:c.source,decisionAssessment:c.decisionAssessment,featureSources:c.featureSources,outcome:c.outcome,observations:c.observations})+'</details></article>';}
function renderResult(r,q,{technical=false}={}){
 const ready=r.authority?.actionReadiness??q?.candidate?.actionReadiness??'Unknown';
 let html='<div class="panel current"><div class="eyebrow">Current decision readiness · CP7</div><h2>'+esc(q?.candidate?.pathway??'Intervention candidate')+' '+badge(ready)+'</h2><p>'+esc(q?.candidate?.scope?.purpose??'Existing CP7 candidate and safeguards remain authoritative.')+'</p><div class="grid"><p><strong>Explanation Sufficiency</strong><br>'+esc(q?.candidate?.explanationSufficiency?.state??'See current CP7 assessment')+'</p><p><strong>Protection Context Sufficiency</strong><br>'+esc(q?.candidate?.protectionContextSufficiency?.state??'See current CP7 assessment')+'</p></div><details><summary>Current safeguards and action requirements</summary><ul>'+(r.authority?.gates??[]).map(g=>'<li>'+esc(g.status)+' · '+esc(g.reason)+'</li>').join('')+'</ul></details></div>';
 html+='<section class="panel historical"><div class="eyebrow">Historical Support for Suitability</div><h2>What happened in similar cases?</h2><p class="small">Simulated historical cases · '+esc(r.retrievalMode??r.state)+'</p>';
 if(!r.descriptor)return html+'<div class="notice warning">'+esc(r.state)+'</div><p>Historical evidence does not change current readiness.</p></section>';
 html+='<h3>'+badge(r.descriptor)+'</h3><div class="stats"><div class="stat"><strong>'+r.qualifyingEpisodes+'</strong>qualifying episodes</div><div class="stat"><strong>'+r.distinctAmenities+'</strong>distinct amenities</div><div class="stat"><strong>'+r.protectionCounts['Protection breach']+'</strong>protection breaches</div></div><div class="counts"><span>Goal Met <strong>'+r.goalCounts.Met+'</strong></span><span>Not met <strong>'+r.goalCounts['Not met']+'</strong></span><span>Mixed <strong>'+r.goalCounts.Mixed+'</strong></span></div>';
 if(r.protectionConcern)html+='<div class="notice danger"><strong>'+esc(r.protectionConcern)+'</strong><p>Benefit cannot offset protected-access harm. '+r.adverseCases.length+' adverse case(s) remain visible across all pages.</p><details open><summary>Protection findings requiring attention</summary>'+r.adverseCases.map(c=>'<p>'+esc(c.label)+' — '+esc(c.outcome.protection.state)+'</p>').join('')+'</details></div>';
 if(r.tension)html+='<div class="notice warning">'+esc(r.tension)+'</div>';
 html+='<p class="small">All qualifying cases in this bound release contribute. The three-amenity floor is provisional demonstration policy; these counts do not establish a success probability.</p>';
 html+='<div id="case-page">'+r.cases.slice(page*3,page*3+3).map(casesCard).join('')+'</div>';
 if(r.cases.length>3)html+='<div class="counts"><button data-page="'+Math.max(0,page-1)+'" '+(!page?'disabled':'')+'>Previous cases</button><span>Page '+(page+1)+' of '+Math.ceil(r.cases.length/3)+'</span><button data-page="'+Math.min(Math.ceil(r.cases.length/3)-1,page+1)+'" '+((page+1)*3>=r.cases.length?'disabled':'')+'>Next cases</button></div>';
 html+='<details><summary>Limitations and related history</summary><p>Observed outcomes are associations. Similarity does not authorise action or establish cause. Current CP7 safeguards and operator approval requirements apply.</p><p>Limited historical cases: '+r.limited.length+'. Related but not comparable: '+r.related.length+'. Superseded, duplicate or excluded records: '+r.excluded.length+'.</p>'+raw({limited:r.limited,related:r.related,excluded:r.excluded})+'</details>';
 html+='<details><summary>Technical details / provenance</summary>'+raw({queryDigest:r.queryDigest,asOf:r.asOf,corpus:r.corpusVersion,corpusDigest:r.corpusDigest,featurePolicy:r.featurePolicy,model:r.model,indexDigest:r.indexDigest,membershipDigest:r.membershipDigest,rawRetrievalDiagnostics:r.cases.map(c=>({id:c.id,rawCosineOrStructuredDiagnostic:c.score})),meaning:'Retrieval diagnostic only; not intervention confidence or success probability.'})+'</details></section>';
 if(technical)html+='<details><summary>Complete acceptance output</summary>'+raw(r)+'</details>';return html;
}
function render(){const parts=location.hash.replace(/^#/,'').split('/'),mode=parts[0]||'product';document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===mode));
 if(mode==='qa'){const key=parts[1]||'A',s=DATA.scenarios.find(s=>s.key===key)||DATA.scenarios[0];app.innerHTML='<div class="eyebrow">Technical QA / Acceptance Cases</div><h1>CP9 acceptance review</h1><p class="small">Each A–O case binds a predeclared isolated synthetic scenario world. Product Demo uses the complete governed corpus; operators cannot filter adverse cases out of its denominator.</p><div class="qa-list">'+DATA.scenarios.map(s=>'<button data-case="'+s.key+'">'+s.key+'</button>').join('')+'</div><h2 style="margin-top:24px">'+esc(s.key+' — '+s.title)+'</h2>'+(s.error?'<div class="panel">'+badge('Leakage rejected')+raw(s)+'</div>':renderResult(s.result,s.query,{technical:true}));}
 else if(mode==='validation'){const v=DATA.validation;app.innerHTML='<div class="eyebrow">Prototype validation on simulated cases</div><h1>Does semantic retrieval add value?</h1><div class="panel"><p>'+esc(v.interpretation)+'</p><table><tr><th>Method</th><th>Mean Precision@3</th><th>Mean reciprocal rank</th></tr><tr><td>Structured-only baseline</td><td>'+v.baseline.precisionAt3.toFixed(3)+'</td><td>'+v.baseline.mrr.toFixed(3)+'</td></tr><tr><td>Structured constraints + semantic retrieval</td><td>'+(v.hybrid?.precisionAt3.toFixed(3)??'Unavailable')+'</td><td>'+(v.hybrid?.mrr.toFixed(3)??'Unavailable')+'</td></tr></table><p>Six held-out English paraphrase queries; predeclared simulated topic-relevance judgements. No intervention-success model was trained. All qualifying cases still contribute to historical patterns.</p><details><summary>Per-query relevance, ranking and pinned model</summary>'+raw(v)+'</details></div>';}
 else{app.innerHTML='<div class="eyebrow">Community Hall · Intervention review</div><h1>Historical evidence for a safer decision</h1><p class="muted">Review the current eligible pathway alongside what happened in comparable amenities.</p>'+renderResult(DATA.product.result,DATA.product.query)+'<p class="small">Portable read-only review: results were generated by the implemented Node service with the real frozen encoder. This HTML includes those captured results; it does not run the model or contact a server.</p>';}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){page=0;location.hash=b.dataset.route;}if(b.dataset.case){page=0;location.hash='qa/'+b.dataset.case;}if(b.dataset.page!==undefined){page=Number(b.dataset.page);render();}});window.addEventListener('hashchange',render);render();
</script></body></html>
