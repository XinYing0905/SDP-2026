<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amenity Decision Intelligence — Outcome Review</title><style>
:root{--ink:#173c39;--muted:#637673;--line:#dce6e1;--green:#1d7866;--wash:#f3f6f2;--amber:#91661b;--red:#a63c40}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font:15px/1.6 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:20px 4%;border-bottom:1px solid var(--line);background:white}header strong{font-size:18px}header small{display:block;color:var(--muted)}nav{display:flex;gap:16px}a{color:var(--green);text-decoration:none}button{border:0;background:var(--green);color:white;padding:12px 17px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#e5eee8;color:var(--ink)}button:disabled{opacity:.45;cursor:default}main{max-width:1300px;margin:30px auto;padding:0 24px}.layout{display:grid;grid-template-columns:240px 1fr;gap:28px}.sidebar{align-self:start}.case{display:block;background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;color:var(--ink)}.case.active{border-color:var(--green);box-shadow:inset 4px 0 var(--green)}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font-size:34px;line-height:1.2;margin:12px 0}h2{font-size:21px;line-height:1.35}h3{font-size:16px;margin-top:0}.sub{color:var(--muted)}.card{padding:24px;border:1px solid var(--line);border-radius:15px;background:white;margin-bottom:18px}.journey{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;margin:22px 0}.journey span{background:#e9efdf;padding:8px 11px;border-radius:6px}.findings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.finding{margin:0;min-height:170px}.state{font-size:23px;font-weight:700;line-height:1.35;margin:12px 0}.danger{border-color:#dba7a5;background:#fff1ef}.tag{display:inline-block;padding:4px 9px;background:#e8f2e9;color:var(--green);border-radius:30px;font-size:12px}.danger .tag{background:#f7d5d1;color:var(--red)}.notice{background:#fff6df;padding:12px 16px;border-radius:9px;margin:16px 0;font-size:13px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.metric{font-size:24px;font-weight:700}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}details{background:white;border:1px solid var(--line);padding:18px;border-radius:12px;margin:15px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;max-height:440px;overflow:auto;font-size:11px;background:#f1f4f1;padding:15px}textarea{width:100%;min-height:140px;font:12px monospace;padding:12px;border:1px solid var(--line);border-radius:8px}input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px}label{display:block;margin:10px 0}.toast{background:#fff6df;padding:14px 4%;color:#775615}.toast:empty{display:none}footer{max-width:1300px;margin:35px auto;padding:0 24px;color:var(--muted);font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{display:flex;gap:8px;overflow:auto}.case{min-width:180px}.findings,.compare{grid-template-columns:1fr}header{align-items:start;gap:12px}nav{flex-direction:column;gap:3px}h1{font-size:28px}}
</style></head><body><header><div><strong>Amenity Decision Intelligence</strong><small>From signals to safer intervention decisions.</small></div><nav><a href="#product">Outcome Review</a><a href="#qa">Technical QA</a><a href="#history">Saved reviews</a></nav></header><div class="toast" id="message" role="status"></div><main id="app"></main><footer>Outcome review records what happened outside this system. No execution, work orders, scheduling or AI learning. Local demonstration identity; source evidence requires review.</footer><script type="module" src="/cp8-app.mjs"></script></body></html>
