<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amenity Decision Intelligence — Operator Command Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134e4a'
            },
            amber: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            },
            danger: {
              50: '#fef2f2', 100: '#fee2e2', 400: '#f87171', 500: '#ef4444',
              600: '#dc2626', 700: '#b91c1c'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function SufficiencyBar({ label, level }) {
      const colors = {
        Low: 'bg-amber-400',
        Partial: 'bg-teal-400',
        Moderate: 'bg-teal-500',
        High: 'bg-teal-600'
      };
      const widths = {
        Low: 'w-1/4',
        Partial: 'w-2/4',
        Moderate: 'w-3/4',
        High: 'w-full'
      };

      return (
        <div className="space-y-1">
          <div className="flex justify-between text-xs font-medium">
            <span className="text-slate-600">{label}</span>
            <span className="font-semibold text-slate-800">{level || 'Low'}</span>
          </div>
          <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div className={`h-full ${colors[level] || 'bg-slate-300'} ${widths[level] || 'w-1/4'} transition-all duration-300`}></div>
          </div>
        </div>
      );
    }

    const INTERVENTION_PATHWAYS = [
      {
        type: 'Monitor',
        description: 'Continue collecting usage data for a further 4–6 weeks without intervention. Appropriate if evidence remains insufficient or signals are ambiguous.',
        isRecommended: false
      },
      {
        type: 'Repair / Restore',
        description: 'Address confirmed operational or physical faults (e.g. lighting ballast, flooring defects). Dispatches maintenance team for prompt physical restoration.',
        isRecommended: true,
        recommendedFor: 'court-badminton-1'
      },
      {
        type: 'Reprogramme',
        description: 'Revise booking schedule and session structure to better align with resident availability while retaining current community use.',
        isRecommended: true,
        recommendedFor: 'community-hall-4'
      },
      {
        type: 'Validate',
        description: 'Commission a brief structured physical inspection or extended cohort comparison to close remaining evidence gaps before acting.',
        isRecommended: false
      },
      {
        type: 'Temporary Alternative-Use Pilot',
        description: 'Trial a new use format for the facility on a time-limited basis to test demand before committing to permanent change.',
        isRecommended: false
      },
      {
        type: 'Preserve',
        description: 'Maintain the space in its current community purpose without changes. Protection context requires preserving township social capacity.',
        isRecommended: false,
        isProtectionSupported: true
      }
    ];

    const HISTORICAL_CASES = [
      {
        id: 'hist-001',
        name: 'Riverside Community Room',
        location: 'Riverside Estate, Phase 3',
        period: '2022–2023',
        supportLabel: 'Historically supportive pattern',
        whySimilar: 'Multi-week booking decline in a shared room with no initial maintenance faults. Configuration mismatch diagnosis.',
        whatHappened: 'Schedule reprogrammed toward evenings and weekends. Usage recovered from 7 to 16 sessions/week over 10 weeks.',
        goalFinding: 'Utilisation target met at week 10. Sustained for 6 months post-review.',
        protectionFinding: 'No protection breach. Room remained in shared community use.',
        hasProtectionBreach: false
      },
      {
        id: 'hist-002',
        name: 'Northgate Hall',
        location: 'Northgate Development, Block B',
        period: '2021–2022',
        supportLabel: 'Mixed historical evidence',
        whySimilar: 'Sustained decline over 10 weeks. Initial hypothesis of configuration mismatch.',
        whatHappened: 'Reprogramme implemented but take-up remained low. Secondary physical ventilation fault discovered at week 8.',
        goalFinding: 'Target not met initially until secondary physical issue resolved.',
        protectionFinding: 'No protection breach recorded.',
        hasProtectionBreach: false
      },
      {
        id: 'hist-003',
        name: 'Oakwood Court Pavilion',
        location: 'Oakwood Sector 4',
        period: '2020–2021',
        supportLabel: 'Precedent with Breach Warning',
        whySimilar: 'Court lighting outage caused usage slump; commercial operator restricted resident evening hours without consultation.',
        whatHappened: 'Court access commercialized, violating township community preservation charter.',
        goalFinding: 'Revenue met but community satisfaction dropped 40%.',
        protectionFinding: 'Protection Breach: resident dedicated hours reduced below required baseline.',
        hasProtectionBreach: true
      }
    ];

    function OperatorApp() {
      // Top Navigation: 'overview' | 'facilities' | 'reports' | 'reviews' | 'outcomes'
      const [currentNav, setCurrentNav] = useState('overview');

      // Sub-screen for Decision Review deep dive
      const [reviewScreen, setReviewScreen] = useState('summary'); // 'summary' | 'gaps' | 'interventions' | 'approval'
      const [selectedFacilityId, setSelectedFacilityId] = useState('court-badminton-1');

      // Data States
      const [overviewData, setOverviewData] = useState(null);
      const [reports, setReports] = useState([]);
      const [maintenanceList, setMaintenanceList] = useState([]);
      const [facilityDetails, setFacilityDetails] = useState(null);
      const [loading, setLoading] = useState(true);

      // Staff Verification Modal/Form State
      const [verifyingReport, setVerifyingReport] = useState(null);
      const [verificationNotes, setVerificationNotes] = useState('');
      const [verifierName, setVerifierName] = useState('Chen Wei (Duty Facilities Tech)');
      const [actionInProgress, setActionInProgress] = useState(false);

      // Selected intervention in review
      const [selectedIntervention, setSelectedIntervention] = useState(null);
      const [approvalSuccess, setApprovalSuccess] = useState(false);

      const refreshData = () => {
        Promise.all([
          fetch('/api/facilities').then(r => r.json()),
          fetch('/api/reports').then(r => r.json()),
          fetch('/api/maintenance').then(r => r.json()),
          fetch(`/api/facilities/${selectedFacilityId}`).then(r => r.json())
        ])
          .then(([facOverview, reportList, maintList, facDetail]) => {
            setOverviewData(facOverview);
            setReports(reportList);
            setMaintenanceList(maintList);
            setFacilityDetails(facDetail);
            setLoading(false);
          })
          .catch(err => {
            console.error('Failed to load data:', err);
            setLoading(false);
          });
      };

      useEffect(() => {
        refreshData();
        const interval = setInterval(refreshData, 3500);
        return () => clearInterval(interval);
      }, [selectedFacilityId]);

      const handleVerifyReport = (report, action = 'verify_fault') => {
        setActionInProgress(true);
        fetch(`/api/reports/${report.report_id}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action,
            verifiedBy: verifierName,
            verificationNotes: verificationNotes || (action === 'verify_fault' ? 'On-site physical inspection confirmed: Court 2 high-bay LED luminaire ballast has failed with severe flickering and inadequate illumination. Replacement scheduled.' : 'On-site inspection completed. No operational defects found.')
          })
        })
          .then(res => res.json())
          .then(res => {
            setActionInProgress(false);
            setVerifyingReport(null);
            setVerificationNotes('');
            refreshData();
          })
          .catch(err => {
            setActionInProgress(false);
            alert('Verification failed: ' + err.message);
          });
      };

      const handleApprovePlan = () => {
        fetch(`/api/reviews/${selectedFacilityId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            approvedBy: 'Regional Operations Lead',
            note: 'Formal plan approval recorded. Execution requires separate operator sign-off.'
          })
        })
          .then(res => res.json())
          .then(() => {
            setApprovalSuccess(true);
            refreshData();
          });
      };

      const handleResetDemo = () => {
        if (!confirm('Reset township database to fresh default state?')) return;
        fetch('/api/reset-demo', { method: 'POST' })
          .then(r => r.json())
          .then(() => {
            setApprovalSuccess(false);
            setSelectedIntervention(null);
            refreshData();
          });
      };

      const badmintonFacility = overviewData?.facilities?.find(f => f.facility_id === 'court-badminton-1');
      const hallFacility = overviewData?.facilities?.find(f => f.facility_id === 'community-hall-4');
      const currentReview = facilityDetails?.review;

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50 font-sans">
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-slate-900 flex flex-col shrink-0 border-r border-slate-800">
            {/* Logo */}
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-teal-500 text-white font-black flex items-center justify-center text-base shadow-md">
                  A
                </div>
                <div>
                  <h1 className="text-white text-sm font-bold tracking-tight">ADI Township</h1>
                  <p className="text-[11px] text-teal-400 font-medium">Amenity Decision Intelligence</p>
                </div>
              </div>
            </div>

            {/* Focus Case Switcher */}
            <div className="px-4 py-3 border-b border-slate-800/80 bg-slate-950/50">
              <span className="text-[10px] font-semibold tracking-wider uppercase text-slate-400 block mb-1">
                Active Focus Case
              </span>
              <select
                value={selectedFacilityId}
                onChange={e => {
                  setSelectedFacilityId(e.target.value);
                  setReviewScreen('summary');
                  setApprovalSuccess(false);
                }}
                className="w-full bg-slate-800 border border-slate-700 rounded-lg text-xs text-white px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-teal-500"
              >
                <option value="court-badminton-1">🏸 Badminton Court (Milestone 1)</option>
                <option value="community-hall-4">🏛️ Community Hall (Schedule Case)</option>
                <option value="tennis-court-west">🎾 Tennis Court (Baseline)</option>
                <option value="multipurpose-room-d">🛠️ Multipurpose Room D (Maintenance)</option>
              </select>
            </div>

            {/* Navigation items */}
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto text-xs font-medium">
              {[
                { id: 'overview', icon: '📊', label: 'Overview' },
                { id: 'facilities', icon: '🏛️', label: 'Facilities' },
                { 
                  id: 'reports', 
                  icon: '🔔', 
                  label: 'Reports & Maintenance', 
                  hasPending: overviewData?.totals?.unverifiedReportsCount > 0
                },
                { id: 'reviews', icon: '⚙️', label: 'Decision Reviews' },
                { id: 'outcomes', icon: '📜', label: 'Outcomes & History' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentNav(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition-all text-left ${
                    currentNav === item.id
                      ? 'bg-teal-600 text-white font-bold shadow-sm'
                      : 'text-slate-400 hover:bg-slate-800/70 hover:text-slate-200'
                  }`}
                >
                  <span className="flex items-center gap-2">
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </span>
                  {item.hasPending && (
                    <span
                      className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shadow-sm"
                      title={`${overviewData?.totals?.unverifiedReportsCount || 0} pending reports`}
                    ></span>
                  )}
                </button>
              ))}
            </nav>

            {/* Bottom Status Panel */}
            <div className="p-3 border-t border-slate-800 space-y-2 bg-slate-950/40">
              <div className="flex items-center justify-between px-1">
                <span className="text-[11px] text-slate-400">Live Sync</span>
                <span className="flex items-center gap-1.5 text-[10px] text-emerald-400 font-mono">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  SQLite WAL Connected
                </span>
              </div>

              <div className="pt-2 border-t border-slate-800/60 flex items-center justify-between">
                <a
                  href={`resident.html?facilityId=${selectedFacilityId}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-amber-400 hover:text-amber-300 underline underline-offset-2 flex items-center gap-1 font-semibold"
                >
                  <span>📱 Resident QR Tab</span> ↗
                </a>
                <button
                  onClick={handleResetDemo}
                  className="text-[11px] text-slate-400 hover:text-rose-400"
                  title="Reset SQLite Database"
                >
                  Reset DB
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT WORKSPACE */}
          <main className="flex-1 overflow-y-auto p-8 max-w-6xl mx-auto space-y-6">
            
            {/* ══════════════════════════════════════════════════════════════
                TAB 1: OVERVIEW (DASHBOARD)
            ══════════════════════════════════════════════════════════════ */}
            {currentNav === 'overview' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900 tracking-tight">Township Amenity Intelligence Center</h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Maplewood Township · 12 Monitored Amenities, QR Incident Verification & Evidentiary Decision Pipeline
                    </p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setCurrentNav('reports')}
                      className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5"
                    >
                      <span>🔔</span>
                      <span>Review Pending Reports ({overviewData?.totals?.unverifiedReportsCount || 0})</span>
                    </button>
                  </div>
                </div>

                {/* 5 Computed KPI Cards */}
                <div className="grid grid-cols-5 gap-3.5">
                  <div className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Monitored Facilities</span>
                    <p className="text-2xl font-black text-slate-800 mt-1">
                      {overviewData?.totals?.totalFacilities || 12}
                    </p>
                    <span className="text-[10px] text-slate-400">Enrolled in digital profile</span>
                  </div>

                  <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-700 block">Unverified Reports</span>
                    <p className="text-2xl font-black text-amber-900 mt-1">
                      {overviewData?.totals?.unverifiedReportsCount || 0}
                    </p>
                    <span className="text-[10px] text-amber-700">Resident claims pending check</span>
                  </div>

                  <div className="p-4 bg-teal-50 border border-teal-200 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-teal-700 block">Flagged for Action</span>
                    <p className="text-2xl font-black text-teal-900 mt-1">
                      {overviewData?.totals?.flaggedForAction || 0}
                    </p>
                    <span className="text-[10px] text-teal-700">Active anomalies or reviews</span>
                  </div>

                  <div className="p-4 bg-blue-50 border border-blue-200 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-blue-700 block">Active Maintenance</span>
                    <p className="text-2xl font-black text-blue-900 mt-1">
                      {overviewData?.totals?.activeMaintenanceCount || 0}
                    </p>
                    <span className="text-[10px] text-blue-700">Dispatched work orders</span>
                  </div>

                  <div className="p-4 bg-slate-900 text-white rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Approved Safe Plans</span>
                    <p className="text-2xl font-black text-teal-400 mt-1">
                      {overviewData?.totals?.activeSafePlans || 0}
                    </p>
                    <span className="text-[10px] text-slate-400">Formally audited plans</span>
                  </div>
                </div>

                {/* Focus Case 1: Badminton Court (Milestone 1 Highlight) */}
                <div className="bg-white border-2 border-amber-500 rounded-2xl p-6 shadow-sm">
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">🏸</span>
                        <h3 className="text-lg font-bold text-slate-900">
                          {badmintonFacility?.name}
                        </h3>
                        <span className="bg-amber-100 text-amber-900 text-xs px-2.5 py-0.5 rounded-full font-bold">
                          Milestone 1 Walkthrough Case
                        </span>
                        {badmintonFacility?.unverifiedReports > 0 && (
                          <span className="bg-rose-500 text-white text-xs px-2.5 py-0.5 rounded-full font-bold animate-pulse">
                            New Report Received ({badmintonFacility.unverifiedReports})
                          </span>
                        )}
                        {badmintonFacility?.verifiedFaults > 0 && (
                          <span className="bg-teal-100 text-teal-800 text-xs px-2.5 py-0.5 rounded-full font-bold">
                            Hardware Defect Confirmed
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        {badmintonFacility?.location} · {badmintonFacility?.type}
                      </p>
                    </div>

                    <div className="flex gap-2">
                      <a
                        href="resident.html?facilityId=court-badminton-1"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold rounded-xl shadow-sm flex items-center gap-1"
                      >
                        <span>📱 Resident QR View</span> ↗
                      </a>
                      <button
                        onClick={() => {
                          setSelectedFacilityId('court-badminton-1');
                          setCurrentNav('reviews');
                        }}
                        className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-sm"
                      >
                        Deep-Dive Review →
                      </button>
                    </div>
                  </div>

                  <div className="mt-4 pt-4 border-t border-slate-100 grid grid-cols-3 gap-4 text-xs">
                    <div>
                      <span className="text-[10px] text-slate-400 font-bold block uppercase">Resident Reports</span>
                      <p className="text-slate-800 font-semibold mt-0.5">
                        {badmintonFacility?.reportsTotal || 0} Total ({badmintonFacility?.unverifiedReports || 0} Pending, {badmintonFacility?.verifiedFaults || 0} Confirmed Faults)
                      </p>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 font-bold block uppercase">Diagnostic Status</span>
                      <p className="text-teal-700 font-bold mt-0.5">
                        {badmintonFacility?.verifiedFaults > 0 ? 'Confirmed Hardware Defect (High Sufficiency)' : 'Monitoring / Awaiting On-Site Verification'}
                      </p>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 font-bold block uppercase">Recommended Pathway</span>
                      <p className="text-slate-700 font-semibold mt-0.5">
                        Repair / Restore (Luminaire ballast replacement)
                      </p>
                    </div>
                  </div>
                </div>

                {/* Focus Case 2: Community Hall (Schedule Case) */}
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">🏛️</span>
                        <h3 className="text-lg font-bold text-slate-900">
                          {hallFacility?.name}
                        </h3>
                        <span className="bg-teal-100 text-teal-800 text-xs px-2.5 py-0.5 rounded-full font-bold">
                          CP6-CP8 Schedule Alignment Case
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        {hallFacility?.location} · Sustained 8-week booking decline (18 to 8 sessions/week)
                      </p>
                    </div>
                    <button
                      onClick={() => {
                        setSelectedFacilityId('community-hall-4');
                        setCurrentNav('reviews');
                      }}
                      className="px-4 py-2 border border-teal-600 text-teal-700 hover:bg-teal-50 text-xs font-bold rounded-xl"
                    >
                      Inspect Schedule Review →
                    </button>
                  </div>
                </div>

                {/* Recent Incoming Reports Stream */}
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-bold text-slate-900">Recent Resident Reports Stream</h4>
                    <button
                      onClick={() => setCurrentNav('reports')}
                      className="text-xs text-teal-600 hover:text-teal-700 font-semibold"
                    >
                      View All Reports ({reports.length}) →
                    </button>
                  </div>

                  {reports.length === 0 ? (
                    <div className="text-center py-6 text-slate-400 text-xs">
                      No reports recorded yet. Open Resident Mobile to submit an issue via QR code!
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {reports.slice(0, 3).map(r => (
                        <div
                          key={r.report_id}
                          className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs"
                        >
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-bold text-slate-800">{r.report_id}</span>
                              <span className="font-semibold text-slate-700">[{r.facility_name || r.facility_id}]</span>
                              <span className="text-slate-500">{r.description}</span>
                            </div>
                            <span className="text-[10px] text-slate-400 mt-0.5 block">
                              Submitted: {new Date(r.submitted_at).toLocaleTimeString()} · Zone: {r.location_detail || 'On-site'}
                            </span>
                          </div>

                          <div className="flex items-center gap-2">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                              r.status === 'verified_fault'
                                ? 'bg-teal-100 text-teal-800'
                                : r.status === 'dismissed'
                                ? 'bg-slate-200 text-slate-600'
                                : 'bg-amber-100 text-amber-800 animate-pulse'
                            }`}>
                              {r.status === 'verified_fault' ? '✓ Verified Fault' : r.status === 'dismissed' ? 'Dismissed' : 'Unverified (Pending)'}
                            </span>
                            {r.status === 'unverified' && (
                              <button
                                onClick={() => {
                                  setVerifyingReport(r);
                                  setCurrentNav('reports');
                                }}
                                className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-[11px]"
                              >
                                Verify
                              </button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ══════════════════════════════════════════════════════════════
                TAB 2: FACILITIES (12 DIRECTORY)

                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ══════════════════════════════════════════════════════════════
                TAB 5: OUTCOMES & HISTORY
            ══════════════════════════════════════════════════════════════ */}
            {currentNav === 'outcomes' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight">Post-Intervention Review & Precedents</h2>
                  <p className="text-xs text-slate-500 mt-1">
                    CP8 4 discrete outcome evaluation findings and CP9 historical case precedents
                  </p>
                </div>

                {/* 4 Separate Outcome Dimensions */}
                <div className="space-y-2">
                  <h3 className="font-bold text-slate-800 text-sm">Discrete Outcome Review Dimensions</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { type: 'Execution', summary: 'Luminaire Replacement Implemented', detail: 'Replaced 4 high-bay LED floodlight ballast modules on Court 2. Illumination restored to 350 Lux standard.', positive: true },
                      { type: 'Goal', summary: 'Evening Peak Bookings Recovered', detail: 'Utilization increased from 65% to 94% within 1 week of repair, returning near benchmark baseline.', positive: true },
                      { type: 'Protection', summary: 'No Community Protection Breach', detail: 'Dedicated community resident hours maintained in full with standard non-commercial pricing.', positive: true },
                      { type: 'Diagnosis', summary: 'Physical Defect Hypothesis Confirmed', detail: 'Utilization recovery following lighting repair confirms that operational hardware defect was the single causal driver.', positive: true },
                    ].map(f => (
                      <div key={f.type} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-1.5 shadow-sm">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-bold text-slate-400 uppercase">{f.type}</span>
                          <span className="text-teal-600 font-bold">✓ Met</span>
                        </div>
                        <h4 className="text-sm font-bold text-slate-800">{f.summary}</h4>
                        <p className="text-xs text-slate-600">{f.detail}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Historical Cases (CP9) */}
                <div className="space-y-3 pt-2">
                  <h3 className="font-bold text-slate-800 text-sm">Historical Precedents (CP9 Hybrid Retrieval)</h3>
                  <div className="space-y-3">
                    {HISTORICAL_CASES.map(c => (
                      <div
                        key={c.id}
                        className={`bg-white rounded-2xl border-2 overflow-hidden shadow-sm ${
                          c.hasProtectionBreach ? 'border-rose-400' : 'border-slate-200'
                        }`}
                      >
                        {c.hasProtectionBreach && (
                          <div className="bg-rose-600 text-white px-4 py-1.5 text-xs font-bold flex items-center gap-2">
                            <span>⚠️ Historical Protection Breach Warning: Precedent reduced resident access below baseline</span>
                          </div>
                        )}
                        <div className="p-5 space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <h4 className="font-bold text-slate-900 text-sm">{c.name}</h4>
                              <p className="text-xs text-slate-500">{c.location} · {c.period}</p>
                            </div>
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                              c.hasProtectionBreach ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'
                            }`}>
                              {c.supportLabel}
                            </span>
                          </div>

                          <div className="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-3 rounded-xl">
                            <div>
                              <strong className="text-slate-700 block mb-0.5">Why Similar:</strong>
                              <p className="text-slate-600">{c.whySimilar}</p>
                            </div>
                            <div>
                              <strong className="text-slate-700 block mb-0.5">Historical Action:</strong>
                              <p className="text-slate-600">{c.whatHappened}</p>
                            </div>
                          </div>

                          <div className="text-xs text-slate-600 flex justify-between pt-1">
                            <span>Goal Finding: {c.goalFinding}</span>
                            <span>Protection Finding: {c.protectionFinding}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<OperatorApp />);
  </script>
</body>
</html>
