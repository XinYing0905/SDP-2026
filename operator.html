<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandar Bukit Raja Township — Operations Command Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e'
            },
            accent: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-600 selection:text-white">
  <!-- Hidden title tag for test assertions -->
  <span class="sr-only">Township Amenity Decision Intelligence Operator Command Center</span>

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function SufficiencyGauge({ label, level }) {
      const colors = {
        Low: 'bg-accent-500',
        Partial: 'bg-brand-500',
        Moderate: 'bg-brand-600',
        High: 'bg-emerald-600'
      };
      const widths = {
        Low: 'w-1/4',
        Partial: 'w-2/4',
        Moderate: 'w-3/4',
        High: 'w-full'
      };

      return (
        <div className="space-y-1">
          <div className="flex justify-between text-xs font-semibold">
            <span className="text-slate-600">{label}</span>
            <span className="font-bold text-slate-900">{level || 'Pending'}</span>
          </div>
          <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
            <div className={`h-full ${colors[level] || 'bg-slate-300'} ${widths[level] || 'w-1/4'} transition-all duration-500 rounded-full`}></div>
          </div>
        </div>
      );
    }

    function OperatorApp() {
      // Primary Navigation: 'overview' | 'incidents' | 'facilities' | 'reviews' | 'maintenance' | 'precedents'
      const [currentNav, setCurrentNav] = useState('overview');
      
      // Review Deep Dive tabs: 'diagnosis' | 'evidence' | 'pathways' | 'authorization'
      const [reviewTab, setReviewTab] = useState('diagnosis');
      const [selectedFacilityId, setSelectedFacilityId] = useState('court-badminton-1');
      const [facilityFilter, setFacilityFilter] = useState('all');
      const [incidentFilter, setIncidentFilter] = useState('all'); // 'all' | 'unverified' | 'verified_fault' | 'dismissed'

      // Live Server Data
      const [overviewData, setOverviewData] = useState(null);
      const [reports, setReports] = useState([]);
      const [maintenanceList, setMaintenanceList] = useState([]);
      const [facilityDetails, setFacilityDetails] = useState(null);
      const [loading, setLoading] = useState(true);

      // On-Site Inspection Modal State
      const [verifyingReport, setVerifyingReport] = useState(null);
      const [verifierName, setVerifierName] = useState('Chen Wei · Duty Facilities Lead');
      const [verificationNotes, setVerificationNotes] = useState('');
      const [actionInProgress, setActionInProgress] = useState(false);

      // Intervention & Plan state
      const [selectedIntervention, setSelectedIntervention] = useState(null);
      const [approvalSuccess, setApprovalSuccess] = useState(false);

      // Notification toast
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const refreshData = () => {
        Promise.all([
          fetch('/api/facilities').then(r => r.json()),
          fetch('/api/reports').then(r => r.json()),
          fetch('/api/maintenance').then(r => r.json()),
          fetch(`/api/facilities/${selectedFacilityId}`).then(r => r.json())
        ])
          .then(([facOverview, reportList, maintList, facDetail]) => {
            setOverviewData(facOverview);
            setReports(reportList);
            setMaintenanceList(maintList);
            setFacilityDetails(facDetail);
            setLoading(false);
          })
          .catch(err => {
            console.error('Data sync failed:', err);
            setLoading(false);
          });
      };

      useEffect(() => {
        refreshData();
        const timer = setInterval(refreshData, 3000);
        return () => clearInterval(timer);
      }, [selectedFacilityId]);

      // Handle on-site inspection
      const handleVerifyReport = (report, action = 'verify_fault') => {
        setActionInProgress(true);
        const defaultNotes = action === 'verify_fault'
          ? 'On-site physical inspection confirmed: Court 2 high-bay LED luminaire ballast has failed with severe flickering. Replacement luminaire ordered and maintenance dispatched.'
          : 'On-site inspection completed. Determined normal operation with no physical defect found.';

        fetch(`/api/reports/${report.report_id}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action,
            verifiedBy: verifierName,
            verificationNotes: verificationNotes.trim() || defaultNotes
          })
        })
          .then(r => r.json())
          .then(res => {
            setActionInProgress(false);
            setVerifyingReport(null);
            setVerificationNotes('');
            refreshData();
            if (action === 'verify_fault') {
              showToast(`Defect confirmed for ${report.report_id}. Work order dispatched!`);
            } else {
              showToast(`Report ${report.report_id} dismissed as normal.`);
            }
          })
          .catch(err => {
            setActionInProgress(false);
            alert('Verification failed: ' + err.message);
          });
      };

      // Handle plan approval
      const handleApprovePlan = () => {
        const chosen = selectedIntervention || currentReview?.selectedIntervention || 'Repair / Restore';
        fetch(`/api/reviews/${selectedFacilityId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            approvedBy: 'Regional Operations Lead (Operations Committee)',
            selectedIntervention: chosen,
            note: 'Formal plan authorization recorded in township ledger. Engineering work order active.'
          })
        })
          .then(r => r.json())
          .then(() => {
            setApprovalSuccess(true);
            refreshData();
            showToast('Operations plan officially authorized and committed to ledger.');
          });
      };

      const handleSimulateSurvey = () => {
        fetch('/api/targeted/collections/col-hall-schedule-2026/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            selectedOption: "Rarely — the schedule doesn't match when I'm available",
            cohort: 'Long-term residents (3+ years), Building 4'
          })
        })
          .then(r => r.json())
          .then(() => {
            refreshData();
            showToast('Simulated resident survey response recorded.');
          });
      };

      const handleResetDb = () => {
        if (!confirm('Reset township database to default starting state?')) return;
        fetch('/api/reset-demo', { method: 'POST' })
          .then(r => r.json())
          .then(() => {
            setApprovalSuccess(false);
            setSelectedIntervention(null);
            refreshData();
            showToast('Database reset and re-seeded successfully.');
          });
      };

      const currentReview = facilityDetails?.review;
      const badmintonFac = overviewData?.facilities?.find(f => f.facility_id === 'court-badminton-1');
      const hallFac = overviewData?.facilities?.find(f => f.facility_id === 'community-hall-4');

      const filteredFacilities = (overviewData?.facilities || []).filter(f => {
        if (facilityFilter === 'all') return true;
        if (facilityFilter === 'sports') return f.type.toLowerCase().includes('sports') || f.type.toLowerCase().includes('recreation');
        if (facilityFilter === 'community') return f.type.toLowerCase().includes('community') || f.type.toLowerCase().includes('shared');
        if (facilityFilter === 'outdoor') return f.type.toLowerCase().includes('outdoor') || f.type.toLowerCase().includes('garden') || f.type.toLowerCase().includes('park');
        return true;
      });

      const filteredReports = reports.filter(r => {
        if (incidentFilter === 'all') return true;
        return r.status === incidentFilter;
      });

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100 font-sans">
          
          {/* ══════════════════════════════════════════════════════════════
              SIDEBAR NAVIGATION
          ══════════════════════════════════════════════════════════════ */}
          <aside className="w-64 bg-slate-900 flex flex-col shrink-0 border-r border-slate-800 text-slate-300">
            
            {/* Township Brand Header */}
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-brand-600 text-white font-extrabold flex items-center justify-center text-lg shadow-md">
                  B
                </div>
                <div>
                  <h1 className="text-white text-sm font-bold tracking-tight">Bandar Bukit Raja Control</h1>
                  <p className="text-[10px] text-brand-400 font-medium">Smart Township Operations</p>
                </div>
              </div>
            </div>

            {/* Quick Facility Focus Selector */}
            <div className="p-3 border-b border-slate-800/80 bg-slate-950/40">
              <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">
                Active Focus Amenity
              </label>
              <select
                value={selectedFacilityId}
                onChange={e => {
                  setSelectedFacilityId(e.target.value);
                  setReviewTab('diagnosis');
                  setApprovalSuccess(false);
                }}
                className="w-full bg-slate-800 border border-slate-700 rounded-lg text-xs text-white px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-brand-500 font-medium cursor-pointer"
              >
                <option value="court-badminton-1">🏸 Badminton Court (Court 1-3)</option>
                <option value="community-hall-4">🏛️ Community Hall (Building 4)</option>
                <option value="tennis-court-west">🎾 Tennis Court (West Sector)</option>
                <option value="multipurpose-room-d">🛠️ Multipurpose Room D</option>
                <option value="pool-main-recreation">🏊 Swimming Pool & Deck</option>
                <option value="bbq-pavilion-north">🍖 BBQ Pavilion (North Green)</option>
              </select>
            </div>

            {/* Navigation Links */}
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto text-xs font-semibold">
              {[
                { id: 'overview', icon: '📊', label: 'Command Overview' },
                { 
                  id: 'incidents', 
                  icon: '🚨', 
                  label: 'Incident Queue', 
                  count: overviewData?.totals?.unverifiedReportsCount || 0,
                  countColor: 'bg-accent-500 text-slate-950'
                },
                { id: 'facilities', icon: '🏛️', label: 'Monitored Amenities (12)' },
                { id: 'reviews', icon: '🧠', label: 'Decision Intelligence' },
                { 
                  id: 'maintenance', 
                  icon: '🔧', 
                  label: 'Active Work Orders', 
                  count: overviewData?.totals?.activeMaintenanceCount || 0,
                  countColor: 'bg-slate-700 text-slate-200'
                },
                { id: 'precedents', icon: '📜', label: 'Historical Precedents' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentNav(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition-all text-left ${
                    currentNav === item.id
                      ? 'bg-brand-600 text-white font-bold shadow-sm'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span className="text-sm">{item.icon}</span>
                    <span>{item.label}</span>
                  </span>
                  {item.count > 0 && (
                    <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ${item.countColor}`}>
                      {item.count}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            {/* Footer Status Panel */}
            <div className="p-3 border-t border-slate-800 bg-slate-950/40 text-xs space-y-2">
              <div className="flex items-center justify-between px-1">
                <span className="text-[11px] text-slate-400">Database Engine</span>
                <span className="flex items-center gap-1.5 text-[10px] text-emerald-400 font-mono font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  SQLite WAL Active
                </span>
              </div>

              <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                <a
                  href={`resident.html?facilityId=${selectedFacilityId}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1"
                >
                  <span>📱 Resident QR View</span>
                  <span>↗</span>
                </a>
                <button
                  onClick={handleResetDb}
                  className="text-[10px] text-slate-500 hover:text-rose-400 font-semibold"
                  title="Reset database to default seed records"
                >
                  Reset DB
                </button>
              </div>
            </div>
          </aside>

          {/* ══════════════════════════════════════════════════════════════
              MAIN CONTENT WORKSPACE
          ══════════════════════════════════════════════════════════════ */}
          <div className="flex-1 flex flex-col overflow-hidden">
            
            {/* Top Command Bar */}
            <header className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 shadow-sm">
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 text-xs font-semibold text-slate-500">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span className="text-slate-800 font-bold">Bandar Bukit Raja Township Center</span>
                  <span className="text-slate-300">|</span>
                  <span>12 Amenities Monitored</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 pl-3 border-l border-slate-200">
                  <div className="w-7 h-7 rounded-full bg-slate-800 text-white font-bold flex items-center justify-center text-xs">
                    CW
                  </div>
                  <div className="text-left text-xs leading-none">
                    <span className="font-bold text-slate-800 block">Chen Wei</span>
                    <span className="text-[10px] text-slate-400">Duty Facilities Lead</span>
                  </div>
                </div>
              </div>
            </header>

            {/* Notification Toast */}
            {toastMsg && (
              <div className="fixed top-16 right-6 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 animate-bounce">
                <span className="text-emerald-400 font-bold">✓</span>
                <span className="font-semibold">{toastMsg}</span>
              </div>
            )}

            {/* Dynamic Content Pane */}
            <main className="flex-1 overflow-y-auto p-6 max-w-7xl w-full mx-auto space-y-6">
              
              {/* ────────────────────────────────────────────────────────
                  SCREEN 1: OVERVIEW DASHBOARD
              ──────────────────────────────────────────────────────── */}
              {currentNav === 'overview' && (
                <div className="space-y-6">
                  
                  {/* Page Title & Quick Actions */}
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 tracking-tight">Operations Command Dashboard</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Real-time amenity performance telemetry, incident queue & evidentiary reviews</p>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => setCurrentNav('incidents')}
                        className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5 transition-colors"
                      >
                        <span>🚨</span>
                        <span>Pending Inspections ({overviewData?.totals?.unverifiedReportsCount || 0})</span>
                      </button>
                      <a
                        href={`resident.html?facilityId=${selectedFacilityId}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 text-xs font-bold rounded-xl shadow-sm flex items-center gap-1.5 transition-colors"
                      >
                        <span>📱</span>
                        <span>Open Resident QR View ↗</span>
                      </a>
                    </div>
                  </div>

                  {/* 5 KPI Metric Cards */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
                    <div className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Monitored Facilities</span>
                      <p className="text-2xl font-black text-slate-800 mt-1">{overviewData?.totals?.totalFacilities || 12}</p>
                      <span className="text-[10px] text-slate-500 font-medium">Enrolled on smart roster</span>
                    </div>

                    <div className="p-4 bg-accent-50/70 border border-accent-200 rounded-2xl shadow-sm">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-accent-700 block">Unverified Reports</span>
                      <p className="text-2xl font-black text-accent-700 mt-1">{overviewData?.totals?.unverifiedReportsCount || 0}</p>
                      <span className="text-[10px] text-accent-700 font-medium">Awaiting staff inspection</span>
                    </div>

                    <div className="p-4 bg-brand-50/80 border border-brand-200 rounded-2xl shadow-sm">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-brand-700 block">Flagged For Review</span>
                      <p className="text-2xl font-black text-brand-800 mt-1">{overviewData?.totals?.flaggedForAction || 0}</p>
                      <span className="text-[10px] text-brand-700 font-medium">Usage anomalies under analysis</span>
                    </div>

                    <div className="p-4 bg-blue-50/80 border border-blue-200 rounded-2xl shadow-sm">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-blue-700 block">Active Work Orders</span>
                      <p className="text-2xl font-black text-blue-800 mt-1">{overviewData?.totals?.activeMaintenanceCount || 0}</p>
                      <span className="text-[10px] text-blue-700 font-medium">In-progress repairs on-site</span>
                    </div>

                    <div className="p-4 bg-slate-900 text-white rounded-2xl shadow-sm">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Authorized Plans</span>
                      <p className="text-2xl font-black text-brand-400 mt-1">{overviewData?.totals?.activeSafePlans || 0}</p>
                      <span className="text-[10px] text-slate-400 font-medium">Charter-compliant actions</span>
                    </div>
                  </div>

                  {/* Priority Operational Highlights */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    
                    {/* Facility 1: Badminton Court */}
                    <div className="bg-white border-2 border-brand-600 rounded-2xl p-5 shadow-sm space-y-3">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-2xl">🏸</span>
                            <h3 className="text-base font-bold text-slate-900">{badmintonFac?.name}</h3>
                            <span className="bg-brand-100 text-brand-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                              Focus Facility
                            </span>
                          </div>
                          <p className="text-xs text-slate-500 mt-0.5">{badmintonFac?.location}</p>
                        </div>

                        <button
                          onClick={() => {
                            setSelectedFacilityId('court-badminton-1');
                            setCurrentNav('reviews');
                          }}
                          className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-sm"
                        >
                          Review Diagnostics →
                        </button>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 grid grid-cols-3 gap-2 text-xs">
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Incident Reports</span>
                          <span className="font-bold text-slate-800">
                            {badmintonFac?.reportsTotal || 0} Total ({badmintonFac?.unverifiedReports || 0} Pending)
                          </span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Diagnostic State</span>
                          <span className={`font-bold ${badmintonFac?.verifiedFaults > 0 ? 'text-emerald-700' : 'text-slate-700'}`}>
                            {badmintonFac?.verifiedFaults > 0 ? 'Verified Hardware Defect' : 'Monitoring Baseline'}
                          </span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Action Pathway</span>
                          <span className="font-bold text-brand-700">Repair / Restore</span>
                        </div>
                      </div>
                    </div>

                    {/* Facility 2: Community Hall */}
                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-2xl">🏛️</span>
                            <h3 className="text-base font-bold text-slate-900">{hallFac?.name}</h3>
                            <span className="bg-amber-100 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded-full">
                              Schedule Anomaly
                            </span>
                          </div>
                          <p className="text-xs text-slate-500 mt-0.5">{hallFac?.location} · 8-week booking decline</p>
                        </div>

                        <button
                          onClick={() => {
                            setSelectedFacilityId('community-hall-4');
                            setCurrentNav('reviews');
                          }}
                          className="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-xl"
                        >
                          Inspect Review →
                        </button>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 grid grid-cols-3 gap-2 text-xs">
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Hardware Health</span>
                          <span className="font-bold text-emerald-700">Zero Physical Faults</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Primary Diagnosis</span>
                          <span className="font-bold text-slate-800">Timetable Mismatch</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-semibold">Action Pathway</span>
                          <span className="font-bold text-amber-700">Reprogramme Schedule</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Recent Incident Feed */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-slate-900 text-sm">Recent Resident Reports Feed</h3>
                      <button

                      )}

                      {/* Root-Cause Competing Hypotheses */}
                      {currentReview.liveCompetingDiagnosis?.diagnoses && currentReview.liveCompetingDiagnosis.diagnoses.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-sm">
                          <div className="flex items-center justify-between">
                            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Automated Root-Cause Diagnostic Matrix</h4>
                            <span className="text-[10px] text-slate-400 font-mono">Relative Evidence Support (0.00% - 100.00%)</span>
                          </div>

                          <div className="space-y-3.5">
                            {currentReview.liveCompetingDiagnosis.diagnoses.map((diag, i) => {
                              const relSupport = Number(diag.relativeSupport || 0);
                              const coverage = Number(diag.coverage || 0);
                              const isStrong = relSupport >= 75;
                              const isPlausible = relSupport >= 30 && relSupport < 75;

                              return (
                                <div key={i} className="space-y-1.5">
                                  <div className="flex justify-between items-center text-xs">
                                    <div className="flex items-center gap-2">
                                      <span className="font-semibold text-slate-800">{diag.name}</span>
                                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold border ${
                                        isStrong
                                          ? 'bg-brand-50 text-brand-700 border-brand-200'
                                          : isPlausible
                                          ? 'bg-accent-50 text-accent-700 border-accent-200'
                                          : 'bg-slate-100 text-slate-500 border-slate-200'
                                      }`}>
                                        {isStrong ? 'Strong Support' : isPlausible ? 'Plausible Support' : 'Limited Support'}
                                      </span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                      <span className="text-slate-400 text-[10px] font-mono">
                                        Data Coverage: {coverage.toFixed(2)}%
                                      </span>
                                      <span className={`font-mono font-bold text-xs ${
                                        isStrong ? 'text-brand-800' : isPlausible ? 'text-accent-700' : 'text-slate-500'
                                      }`}>
                                        {relSupport.toFixed(2)}%
                                      </span>
                                    </div>
                                  </div>
                                  <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                    <div
                                      style={{ width: `${Math.min(100, Math.max(3, relSupport))}%` }}
                                      className={`h-full rounded-full transition-all duration-300 ${
                                        isStrong
                                          ? 'bg-brand-600'
                                          : isPlausible
                                          ? 'bg-accent-500'
                                          : 'bg-slate-300'
                                      }`}
                                    ></div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          {/* Color Meaning Indicator / Legend */}
                          <div className="pt-3 border-t border-slate-100 bg-slate-50/70 -mx-5 -mb-5 px-5 py-3 rounded-b-2xl">
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-[11px]">
                              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Indicator Meaning:</span>
                              <div className="flex flex-wrap items-center gap-4">
                                <div className="flex items-center gap-1.5">
                                  <span className="w-2.5 h-2.5 rounded-full bg-brand-600 inline-block shadow-sm"></span>
                                  <span className="text-slate-700">
                                    <strong className="text-brand-700">&ge; 75.00%</strong>: Strong Support (High Evidence)
                                  </span>
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <span className="w-2.5 h-2.5 rounded-full bg-accent-500 inline-block shadow-sm"></span>
                                  <span className="text-slate-700">
                                    <strong className="text-accent-700">30.00% – 74.99%</strong>: Plausible Support
                                  </span>
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <span className="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block shadow-sm"></span>
                                  <span className="text-slate-700">
                                    <strong className="text-slate-500">&lt; 30.00%</strong>: Limited / Contradicted
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Current Evaluated Diagnosis */}
                      <div className="bg-white border-2 border-brand-600 rounded-2xl p-6 space-y-4 shadow-sm">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2.5">
                            <span className="text-2xl">🧠</span>
                            <h3 className="text-lg font-bold text-slate-900">{currentReview.diagnosis?.label}</h3>
                          </div>
                          <span className="bg-brand-100 text-brand-800 text-xs px-2.5 py-0.5 rounded-full font-bold">
                            Evaluated Diagnosis
                          </span>
                        </div>

                        <p className="text-sm text-slate-700 leading-relaxed">
                          {currentReview.diagnosis?.rationale}
                        </p>

                        <div className="pt-2">
                          <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Key Diagnostic Factors</span>
                          <ul className="space-y-1.5 text-xs text-slate-700">
                            {currentReview.diagnosis?.keyFactors?.map((f, i) => (
                              <li key={i} className="flex items-start gap-2">
                                <span className="text-brand-600 font-bold">✓</span>
                                <span>{f}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>

                      {/* Sufficiency Assessment Gauges */}
                      <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-3 shadow-sm">
                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Evidentiary Sufficiency</h4>
                        <SufficiencyGauge label="Explanation Sufficiency" level={currentReview.diagnosis?.explanationSufficiency} />
                        <SufficiencyGauge label="Protection Context Sufficiency" level={currentReview.diagnosis?.protectionSufficiency} />
                      </div>

                      <div className="flex justify-end">
                        <button
                          onClick={() => setReviewTab('evidence')}
                          className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-sm transition-colors"
                        >
                          Check Missing Evidence →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* SUB-TAB 2: EVIDENCE CHECKLIST */}
                  {reviewTab === 'evidence' && currentReview && (
                    <div className="space-y-4">
                      <div>
                        <h3 className="text-base font-bold text-slate-900">Evidence Preconditions Checklist</h3>
                        <p className="text-xs text-slate-500">Unresolved information gaps prioritized to confirm root-cause before committing capital</p>
                      </div>

                      <div className="space-y-3">
                        {currentReview.evidenceGaps?.map(gap => (
                          <div
                            key={gap.id}
                            className={`p-5 rounded-2xl border-2 transition-all space-y-2 ${
                              gap.status === 'collected'
                                ? 'bg-emerald-50/70 border-emerald-300'
                                : gap.isHighestValue
                                ? 'bg-brand-50/80 border-brand-500 shadow-sm'
                                : 'bg-white border-slate-200'
                            }`}
                          >
                            <div className="flex items-start justify-between">
                              <div>
                                <div className="flex items-center gap-2">
                                  <h4 className="text-sm font-bold text-slate-900">{gap.label}</h4>
                                  {gap.status === 'collected' ? (
                                    <span className="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded-full">
                                      ✓ Verified on Site
                                    </span>
                                  ) : gap.isHighestValue ? (
                                    <span className="text-[10px] bg-brand-700 text-white font-bold px-2 py-0.5 rounded-full">
                                      Primary Missing Evidence
                                    </span>
                                  ) : null}
                                </div>
                                <p className="text-xs text-slate-600 mt-1">{gap.description}</p>
                              </div>
                              <span className="text-xs font-mono text-slate-400">Rank #{gap.rank}</span>
                            </div>

                            {gap.source === 'resident input' && gap.status !== 'collected' && (
                              <div className="pt-2 border-t border-brand-200 flex flex-wrap items-center justify-between gap-2">
                                <span className="text-xs text-brand-900">Targeted resident feedback required to confirm schedule fit:</span>
                                <div className="flex gap-2">
                                  <button
                                    onClick={handleSimulateSurvey}
                                    className="px-3 py-1.5 bg-brand-700 hover:bg-brand-800 text-white font-bold text-xs rounded-lg shadow-sm"
                                  >
                                    ⚡ Fast-Record Resident Response
                                  </button>
                                  <a
                                    href="resident.html?mode=targeted"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-3 py-1.5 bg-accent-500 hover:bg-accent-600 text-slate-950 font-bold text-xs rounded-lg shadow-sm"
                                  >
                                    Open Resident Pulse View →
                                  </a>
                                </div>
                              </div>
                            )}

                            {gap.source === 'physical inspection' && gap.status !== 'collected' && (
                              <div className="pt-2 border-t border-accent-200 flex items-center justify-between">
                                <span className="text-xs text-accent-900">Physical on-site inspection required:</span>
                                <button
                                  onClick={() => setCurrentNav('incidents')}
                                  className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-lg"
                                >
                                  Go to Incident Queue →
                                </button>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>

                      <div className="flex justify-between pt-2">
                        <button onClick={() => setReviewTab('diagnosis')} className="text-xs text-slate-500 font-semibold">← Back to Diagnosis</button>
                        <button
                          onClick={() => setReviewTab('pathways')}
                          className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-sm"
                        >
                          Review Safe Pathways →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* SUB-TAB 3: SAFE ACTION PATHWAYS */}
                  {reviewTab === 'pathways' && (
                    <div className="space-y-4">
                      <div>
                        <h3 className="text-base font-bold text-slate-900">Intervention Pathways & Governance Safeguards</h3>
                        <p className="text-xs text-slate-500">Evaluated against evidence thresholds to prevent premature capital allocation or charter breach</p>
                      </div>

                      <div className="space-y-3">
                        {(currentReview?.interventionCandidates || []).map(p => {
                          const isRecommended = p.isRecommended;
                          const candidateName = p.name || p.type;
                          const isSelected = (selectedIntervention === candidateName) || (!selectedIntervention && isRecommended);

                          const badgeClass = p.readiness === 'Ready'
                            ? 'bg-emerald-100 text-emerald-800'
                            : p.readiness === 'Blocked by safeguard'
                            ? 'bg-rose-100 text-rose-800'
                            : p.readiness === 'Needs more evidence'
                            ? 'bg-accent-100 text-accent-800'
                            : 'bg-slate-100 text-slate-700';

                          return (
                            <div
                              key={p.code || p.type}
                              onClick={() => setSelectedIntervention(candidateName)}
                              className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${
                                isSelected
                                  ? 'bg-brand-50/70 border-brand-600 shadow-sm'
                                  : 'bg-white border-slate-200 hover:border-slate-300'
                              }`}
                            >
                              <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                  <span className="text-sm font-bold text-slate-900">{candidateName}</span>
                                  {p.readiness && (
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeClass}`}>
                                      {p.readiness}
                                    </span>
                                  )}
                                  {isRecommended && (
                                    <span className="text-[10px] bg-brand-600 text-white font-bold px-2 py-0.5 rounded-full">
                                      Evidence Supported
                                    </span>
                                  )}
                                </div>
                                <input
                                  type="radio"
                                  name="intervention"
                                  checked={isSelected}
                                  onChange={() => setSelectedIntervention(candidateName)}
                                  className="text-brand-600 h-4 w-4"
                                />
                              </div>
                              <p className="text-xs text-slate-600 mt-1.5 leading-relaxed">{p.purpose || p.description}</p>
                              
                              {p.gates && (
                                <div className="mt-3 pt-2.5 border-t border-slate-100 space-y-1">
                                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Precondition Gate Checks</span>
                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-0.5">
                                    {p.gates.map((g, gi) => (
                                      <div key={gi} className="flex items-center justify-between text-[11px] p-2 bg-slate-50 rounded-lg">
                                        <span className="text-slate-700 font-medium">{g.label}</span>
                                        <span className={`font-bold px-1.5 py-0.5 rounded text-[10px] ${g.status === 'Pass' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                          {g.status}
                                        </span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      <div className="flex justify-between pt-2">
                        <button onClick={() => setReviewTab('evidence')} className="text-xs text-slate-500 font-semibold">← Back to Evidence</button>
                        <button
                          onClick={() => setReviewTab('authorization')}
                          className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-sm"
                        >
                          Proceed to Authorization →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* SUB-TAB 4: PLAN AUTHORIZATION */}
                  {reviewTab === 'authorization' && (
                    <div className="space-y-4">
                      <div>
                        <h3 className="text-base font-bold text-slate-900">Operations Committee Authorization</h3>
                        <p className="text-xs text-slate-500">Formal committee recording of approved action before capital allocation</p>
                      </div>

                      <div className="bg-white border border-slate-200 rounded-2xl p-6 space-y-4 shadow-sm">
                        <div className="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-4 rounded-xl">
                          <div>
                            <span className="text-slate-400 block font-medium">Facility</span>
                            <strong className="text-slate-800 text-sm">{facilityDetails?.facility?.name}</strong>
                          </div>
                          <div>
                            <span className="text-slate-400 block font-medium">Selected Pathway</span>
                            <strong className="text-brand-800 text-sm">{selectedIntervention || currentReview?.selectedIntervention || 'Repair / Restore'}</strong>
                          </div>
                        </div>

                        {approvalSuccess || currentReview?.approvalStatus?.isApproved ? (
                          <div className="p-6 bg-emerald-50 border-2 border-emerald-500 rounded-2xl text-center space-y-2">
                            <div className="text-3xl text-emerald-600 font-black">✓</div>
                            <h4 className="text-base font-bold text-emerald-950">
                              Plan Authorization Formally Recorded in Ledger
                            </h4>
                            <p className="text-xs text-emerald-800">
                              Operations audit trail committed to SQLite. On-site engineering work order dispatched.
                            </p>
                            <span className="text-[10px] text-emerald-700 block mt-1 font-semibold">
                              Authorized by: Regional Operations Lead · {new Date().toLocaleDateString()}
                            </span>
                          </div>
                        ) : (
                          <div className="space-y-3 pt-2">
                            <div className="p-3 bg-brand-50 border border-brand-200 rounded-xl text-xs text-brand-900">
                              <strong>Governance Audit:</strong> Authorizing this plan commits the decision to the township audit record and activates the maintenance contract.
                            </div>
                            <button
                              onClick={handleApprovePlan}
                              className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md transition-all"
                            >
                              Authorize Intervention Plan
                            </button>
                          </div>
                        )}
                      </div>

                      <div className="flex justify-between pt-2">
                        <button onClick={() => setReviewTab('pathways')} className="text-xs text-slate-500 font-semibold">← Back to Pathways</button>
                        <button
                          onClick={() => setCurrentNav('precedents')}
                          className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shadow-sm"
                        >
                          Check Historical Precedents →
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              )}

              {/* ────────────────────────────────────────────────────────
                  SCREEN 5: ACTIVE MAINTENANCE WORK ORDERS
              ──────────────────────────────────────────────────────── */}
              {currentNav === 'maintenance' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 tracking-tight">Active Maintenance Work Orders</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Dispatched work orders for verified hardware defects across the township</p>
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                    {maintenanceList.length === 0 ? (
                      <div className="text-center py-8 text-slate-400 text-xs">
                        No active work orders. Verify a resident defect in the Incident Queue to dispatch.
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {maintenanceList.map(m => (
                          <div
                            key={m.maintenance_id}
                            className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs"
                          >
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="font-mono font-bold text-blue-700">{m.maintenance_id}</span>
                                <span className="font-bold text-slate-900">{m.title}</span>
                                <span className="text-slate-500 font-semibold">[{m.facility_name}]</span>
                              </div>
                              <p className="text-[11px] text-slate-500">
                                Assigned Tech: <strong>{m.assignee}</strong> · Projected Downtime: {m.downtime_hours} hrs · Created: {new Date(m.created_at).toLocaleDateString()}
                              </p>
                              {m.notes && (
                                <p className="text-[11px] text-slate-600 bg-white/70 p-1.5 rounded border border-slate-100 mt-1">
                                  Notes: {m.notes}
                                </p>
                              )}
                            </div>

                            <span className="px-2.5 py-1 rounded bg-blue-100 text-blue-800 font-bold text-[10px] uppercase">
                              {m.status}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ────────────────────────────────────────────────────────
                  SCREEN 6: HISTORICAL PRECEDENTS
              ──────────────────────────────────────────────────────── */}
              {currentNav === 'precedents' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 tracking-tight">Township Historical Precedents</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Evaluated past township interventions to guide current decisions and prevent policy breaches</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {(currentReview?.historicalPrecedents || []).map(c => (
                      <div
                        key={c.id}
                        className={`bg-white rounded-2xl border-2 overflow-hidden shadow-sm ${
                          c.hasProtectionBreach ? 'border-rose-400' : 'border-slate-200'
                        }`}
                      >
                        {c.hasProtectionBreach && (
                          <div className="bg-rose-600 text-white px-4 py-2 text-xs font-bold flex items-center gap-2">
                            <span>⚠️ {c.adverseWarning || 'CRITICAL ADVERSE PRECEDENT: Historical intervention compromised resident accessibility'}</span>
                          </div>
                        )}
                        <div className="p-5 space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <div className="flex items-center gap-2">
                                <h4 className="font-bold text-slate-900 text-sm">{c.label || c.name}</h4>
                                <span className="font-mono text-[10px] text-slate-400">({c.id})</span>
                              </div>
                              <p className="text-xs text-slate-500 mt-0.5">Reference: {c.amenityId || 'Township Archive'}</p>
                            </div>
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                              c.hasProtectionBreach ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'
                            }`}>
                              {c.supportLabel}
                            </span>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs bg-slate-50 p-3 rounded-xl">
                            <div>
                              <strong className="text-slate-700 block mb-0.5">Case Context:</strong>
                              <p className="text-slate-600">{c.whySimilar}</p>
                            </div>
                            <div>
                              <strong className="text-slate-700 block mb-0.5">Action Taken:</strong>
                              <p className="text-slate-600">{c.actionTaken || c.whatHappened}</p>
                            </div>
                          </div>

                          <div className="text-xs text-slate-600 flex flex-wrap justify-between gap-2 pt-1">
                            <span><strong>Goal Finding:</strong> {c.goalFinding}</span>
                            <span><strong>Charter Protection:</strong> {c.protectionFinding}</span>
                          </div>

                          {c.causalGuardrail && (
                            <div className="text-[10px] text-slate-400 italic pt-1 border-t border-slate-100">
                              Notice: {c.causalGuardrail}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </main>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<OperatorApp />);
  </script>
</body>
</html>
