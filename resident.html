<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maplewood Township — Resident Amenity Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b'
            },
            accent: {
              500: '#f59e0b',
              600: '#d97706'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes scanbeam {
      0% { top: 10%; opacity: 0.8; }
      50% { top: 85%; opacity: 1; }
      100% { top: 10%; opacity: 0.8; }
    }
    .scanner-beam {
      animation: scanbeam 2.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 text-slate-800 selection:bg-brand-500 selection:text-white">
  <!-- Hidden marker for test suites -->
  <span class="sr-only">Resident Mobile Touchpoint</span>
  
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    const FAULT_CATEGORIES = [
      { id: 'lighting', icon: '💡', name: 'Lighting & Electrical', placeholder: 'e.g. Overhead floodlight flickering, court too dim for evening play' },
      { id: 'equipment', icon: '🏸', name: 'Nets & Equipment', placeholder: 'e.g. Center net cord broken or sagging below standard height' },
      { id: 'cleanliness', icon: '🧹', name: 'Flooring & Cleanliness', placeholder: 'e.g. Slippery court surface, water pooling after rain' },
      { id: 'hvac', icon: '❄️', name: 'Ventilation & Airflow', placeholder: 'e.g. Exhaust fan noisy or air conditioner not cooling' },
      { id: 'safety', icon: '⚠️', name: 'Safety & Hardware', placeholder: 'e.g. Loose door hinge, broken bench, sharp metal edge' },
      { id: 'other', icon: '📝', name: 'General Feedback', placeholder: 'Describe what needs attention...' }
    ];

    // Notices of facility closures / maintenance
    const OPERATIONAL_NOTICES = [
      {
        id: 'not-01',
        type: 'closure',
        badge: 'Temporary Closure',
        badgeColor: 'bg-rose-100 text-rose-700 border-rose-200',
        facility: 'Badminton Court 2',

      {

        badge: 'Scheduled Maintenance',
        badgeColor: 'bg-amber-100 text-amber-800 border-amber-200',
        facility: 'Olympic Lap Pool',
        title: 'Deep Chlorination & Sand Filter Backwash',
        details: 'This Thursday 08:00 – 12:00. Pool deck closed during chemical balance treatment.',
        icon: '🏊'
      },
      {
        id: 'not-03',
        type: 'reopened',
        badge: 'Reopened',
        badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        facility: 'Tennis Courts 1 & 2',
        title: 'Surface Non-Slip Recoating Complete',
        details: 'Surface lines repainted and inspected. Open for daily resident play 07:00 – 22:00.',
        icon: '🎾'
      }
    ];

    // Community Activities Bulletin
    const COMMUNITY_ACTIVITIES = [
      {
        id: 'act-01',
        title: 'Morning Sunrise Yoga & Stretching',
        time: 'Saturday · 07:30 – 08:30 AM',
        location: 'Community Hall 4 (Aircon Hall)',
        cohort: 'All Residents · Free Admission',
        instructor: 'Coach Sarah · 24 spots booked',
        icon: '🧘'
      },
      {
        id: 'act-02',
        title: 'Township Friendly Badminton Doubles',
        time: 'Sunday · 16:00 – 18:00 PM',
        location: 'Sports Complex Court 1',
        cohort: 'Intermediate / Casual Play',
        instructor: 'Township Sports Club · Shuttles provided',
        icon: '🏸'
      },
      {
        id: 'act-03',
        title: 'Organic Composting & Urban Herb Gardening',
        time: 'Friday · 10:00 – 11:30 AM',
        location: 'East Eco Pavilion & Herb Garden',
        cohort: 'Family & Senior Friendly',
        instructor: 'Green Volunteers Group · Free seedling kits',
        icon: '🌱'
      },
      {
        id: 'act-04',
        title: 'Weekend Toddler Sensory Storytime',
        time: 'Sunday · 10:00 – 11:00 AM',
        location: 'Central Playground Function Room B',
        cohort: 'Ages 2 – 5 & Parents',
        instructor: 'Maplewood Youth Committee',
        icon: '👶'
      }
    ];

    // Unclickable Facility Booking Catalog (Demo / Disabled items as requested)
    const BOOKING_PREVIEW_ITEMS = [
      {
        id: 'book-badminton',
        name: 'Badminton Courts (1–3)',
        rate: 'Free for Residents · Max 2 hrs/day',
        hours: '07:00 – 22:30',
        demand: 'High Demand Peak (18:00 - 21:00)',
        icon: '🏸'
      },
      {
        id: 'book-tennis',
        name: 'Outdoor Tennis Courts',
        rate: 'Free for Residents · Walk-in / Reservation',
        hours: '07:00 – 22:00',
        demand: 'Weekend Morning Slots Recommended',
        icon: '🎾'
      },
      {
        id: 'book-bbq',
        name: 'BBQ Pavilion & Grills (Pit 1–4)',
        rate: '$15 Cleaning Deposit · 4-hour slots',
        hours: '11:00 – 15:00 / 17:00 – 21:00',
        demand: 'Advance Permit Required',
        icon: '🍖'
      },
      {
        id: 'book-hall',
        name: 'Multi-Purpose Community Hall 4',
        rate: 'Private Events: $50/hr · Club Meetings: Free',
        hours: '08:00 – 22:00',
        demand: 'Requires Management Committee Review',
        icon: '🏛️'
      }
    ];

    function ResidentApp() {
      // Views: 'home' | 'facility' (QR touchpoint) | 'report' | 'success' | 'facilities' | 'track' | 'pulse'
      const [currentView, setCurrentView] = useState('home');
      const [facilities, setFacilities] = useState([]);
      const [selectedFacility, setSelectedFacility] = useState(null);
      const [loading, setLoading] = useState(true);

      // Report form state
      const [category, setCategory] = useState('lighting');
      const [locationDetail, setLocationDetail] = useState('Court 2 (North End)');
      const [description, setDescription] = useState('Court 2 overhead high-bay floodlight is flickering severely; back court is too dim for safe play.');
      const [contact, setContact] = useState('Resident Li · Unit 4-602');
      const [attachedPhoto, setAttachedPhoto] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [lastSubmission, setLastSubmission] = useState(null);

      // Persistent My Reports Tracking (No manual code typing required!)
      const [myReportIds, setMyReportIds] = useState(() => {
        try {
          const saved = localStorage.getItem('resident_my_reports');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [allReports, setAllReports] = useState([]);
      const [trackedReport, setTrackedReport] = useState(null);
      const [trackingCode, setTrackingCode] = useState('');
      const [trackError, setTrackError] = useState('');
      const [isTracking, setIsTracking] = useState(false);

      // QR Scanner Simulator Modal State
      const [showQrModal, setShowQrModal] = useState(false);

      // Pulse Community Survey state
      const [pulseOption, setPulseOption] = useState(null);
      const [pulseSubmitting, setPulseSubmitting] = useState(false);
      const [pulseSubmitted, setPulseSubmitted] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const fetchReportsList = () => {
        fetch('/api/reports')
          .then(r => r.json())
          .then(data => {
            const list = Array.isArray(data) ? data : [];
            setAllReports(list);
            if (list.length > 0 && !trackedReport) {
              // Pre-select the latest report if available
              setTrackedReport(list[0]);
            }
          })
          .catch(() => {});
      };

      useEffect(() => {
        // Fetch Facilities
        fetch('/api/facilities')
          .then(r => r.json())
          .then(data => {
            const list = data.facilities || [];
            setFacilities(list);

            const paramFacilityId = getQueryParam('facilityId');
            const paramMode = getQueryParam('mode');

            if (paramMode === 'targeted' || paramMode === 'survey' || paramMode === 'pulse') {
              setCurrentView('pulse');
            } else if (paramFacilityId) {
              const found = list.find(f => f.facility_id === paramFacilityId) || list[0];
              setSelectedFacility(found);
              setCurrentView('facility');
            } else {
              const defaultFac = list.find(f => f.facility_id === 'court-badminton-1') || list[0];
              setSelectedFacility(defaultFac);
              setCurrentView('home'); // Default to the new rich Homepage
            }
            setLoading(false);
          })
          .catch(err => {
            console.error('Failed to connect:', err);
            setLoading(false);
          });

        fetchReportsList();
      }, []);

      const handleSelectFacility = (fac) => {
        setSelectedFacility(fac);
        setCurrentView('facility');
      };

      const handleSimulateScan = (facId) => {
        const found = facilities.find(f => f.facility_id === facId) || facilities[0];
        setSelectedFacility(found);
        setShowQrModal(false);
        setCurrentView('facility');
        showToast(`📍 Scanned: ${found ? found.name : 'Amenity QR Code'}`);
      };

      const handleReportSubmit = (e) => {
        e.preventDefault();
        if (!description.trim() || !selectedFacility) return;
        setIsSubmitting(true);

        fetch(`/api/facilities/${selectedFacility.facility_id}/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            category,
            description,
            locationDetail,
            contact
          })
        })
          .then(r => r.json())
          .then(res => {
            setIsSubmitting(false);
            setLastSubmission(res);
            const newId = res.reportId || res.referenceId;
            if (newId) {
              const updated = [newId, ...myReportIds.filter(id => id !== newId)];
              setMyReportIds(updated);
              try {
                localStorage.setItem('resident_my_reports', JSON.stringify(updated));
              } catch (e) {}
            }
            fetchReportsList();
            setCurrentView('success');
            showToast('Fault report submitted to Township Operations');
          })
          .catch(err => {
            setIsSubmitting(false);
            alert('Failed to submit report. Please check your connection.');
          });
      };

      const handleTrackLookup = (codeToSearch) => {
        const query = (codeToSearch || trackingCode).trim();
        if (!query) return;
        setIsTracking(true);
        setTrackError('');

        fetch('/api/reports')
          .then(r => r.json())
          .then(reports => {
            setIsTracking(false);
            setAllReports(reports || []);
            const match = reports.find(r => r.report_id.toLowerCase() === query.toLowerCase());
            if (match) {
              setTrackedReport(match);
            } else {
              setTrackError('No report found matching reference "' + query + '". Please verify the ticket code.');
            }
          })
          .catch(() => {
            setIsTracking(false);
            setTrackError('Could not connect to tracking server.');
          });
      };

      const handlePulseSubmit = () => {
        if (!pulseOption) return;
        setPulseSubmitting(true);

        fetch('/api/targeted/collections/col-hall-schedule-2026/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            selectedOption: pulseOption,
            cohort: 'Long-term residents (3+ years), Building 4'
          })
        })
          .then(r => r.json())
          .then(() => {
            setPulseSubmitting(false);
            setPulseSubmitted(true);
            showToast('Thank you! Your feedback helps optimize facility hours.');
          })
          .catch(() => {
            setPulseSubmitting(false);
            alert('Could not submit feedback.');
          });
      };

      const simulatePhotoAttach = () => {
        if (attachedPhoto) {
          setAttachedPhoto(null);
        } else {
          setAttachedPhoto({
            name: 'fault_photo_' + Date.now().toString().slice(-4) + '.jpg',
            time: 'Just now',
            size: '1.8 MB'
          });
          showToast('Photo attached: fault_photo.jpg');
        }
      };

      // User's past reports list (auto-populated so user never needs to type!)
      const residentReportsList = allReports.filter(r =>
        myReportIds.includes(r.report_id) || (r.contact && r.contact.includes('Unit 4-602'))
      );
      // Fallback: If no user reports yet, display recent system reports so the list is immediately usable
      const displayReports = residentReportsList.length > 0 ? residentReportsList : allReports.slice(0, 5);

      return (
        <div className="w-full max-w-md flex flex-col items-center my-0 sm:my-3">
          
          {/* Top Device Status Bar / Staff Center Link */}
          <header className="w-full px-4 py-2 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-semibold text-slate-200">Maplewood Township Portal</span>
            </div>
            <a
              href="operator.html"
              className="text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1 font-medium bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-800"
              title="Switch to Management Command Center"
            >
              <span>Staff Center</span>
              <span>↗</span>
            </a>
          </header>

          {/* App Container */}
          <main className="w-full bg-white sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden relative border border-slate-200 min-h-[740px] max-h-[95vh]">
            
            {/* Top Branding Banner */}
            <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white p-4 shrink-0 flex items-center justify-between shadow-sm">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setCurrentView('home')}
                  className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-xl shadow-inner hover:scale-105 transition-transform"
                  title="Return to Homepage"
                >
                  🏡
                </button>
                <div>
                  <h1 className="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
                    Maplewood Community
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-semibold px-1.5 py-0.5 rounded">Township</span>
                  </h1>
                  <p className="text-[11px] text-slate-300 mt-0.5">Resident Services & Amenity Care</p>
                </div>
              </div>

              {/* QR Scanner Trigger / On-Site Badge */}
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setShowQrModal(true)}
                  className="px-2.5 py-1 bg-emerald-600/90 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg border border-emerald-400/40 flex items-center gap-1 shadow-xs transition-all active:scale-95"
                  title="Scan facility QR code"
                >
                  <span>📷</span>
                  <span className="hidden xs:inline">Scan QR</span>
                </button>
              </div>
            </div>

            {/* Notification Toast */}
            {toastMsg && (
              <div className="absolute top-16 left-4 right-4 z-50 bg-slate-900 text-white text-xs px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-700 flex items-center gap-2 animate-bounce">
                <span>✓</span>
                <span className="font-medium">{toastMsg}</span>
              </div>
            )}

            {/* Scrollable Content Body */}
            <div className="flex-1 overflow-y-auto p-4 sm:p-5 flex flex-col space-y-4">

              {/* ────────────────────────────────────────────────────────
                  VIEW: HOMEPAGE (NEW RESIDENT HOME)
              ──────────────────────────────────────────────────────── */}
              {currentView === 'home' && (
                <div className="space-y-5">
                  
                  {/* Resident Profile Greeting & Weather Summary */}
                  <div className="bg-gradient-to-br from-emerald-800 to-slate-900 rounded-2xl p-4 text-white relative overflow-hidden shadow-sm">
                    <div className="flex items-start justify-between relative z-10">
                      <div>
                        <span className="text-[10px] text-emerald-300 uppercase font-bold tracking-wider">Welcome back</span>
                        <h2 className="text-base font-bold text-white mt-0.5">Resident Li · Unit 4-602</h2>
                        <p className="text-xs text-slate-300 mt-1 flex items-center gap-1.5">
                          <span>📍</span> Building 4 · Maplewood Central
                        </p>
                      </div>
                      <div className="text-right">
                        <span className="inline-flex items-center gap-1 bg-white/10 backdrop-blur-xs px-2 py-0.5 rounded-full text-[10px] font-bold text-emerald-200 border border-white/10">
                          <span>☀️</span> 28°C Sunny
                        </span>
                        <span className="block text-[10px] text-slate-300 mt-1">
                          11 of 12 Amenities Open
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Quick Action Tiles Hub */}
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center justify-between">
                      <span>Quick Resident Actions</span>
                      <span className="text-[10px] text-emerald-600 font-semibold">1-Tap Access</span>
                    </h3>
                    <div className="grid grid-cols-2 gap-2.5">
                      
                      {/* 1. Scan QR */}
                      <button
                        onClick={() => setShowQrModal(true)}
                        className="p-3.5 bg-gradient-to-br from-emerald-50 to-emerald-100/60 border border-emerald-200/90 rounded-2xl text-left flex flex-col justify-between hover:border-emerald-300 hover:shadow-sm transition-all group"
                      >
                        <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-lg shadow-sm group-hover:scale-105 transition-transform">
                          📷
                        </div>
                        <div className="mt-2.5">
                          <strong className="text-xs text-slate-900 block font-bold">Scan Facility QR</strong>
                          <span className="text-[10px] text-emerald-700 font-medium">Instant on-site defect report</span>
                        </div>
                      </button>

                      {/* 2. Track Past Reports without typing */}
                      <button
                        onClick={() => {
                          fetchReportsList();
                          setCurrentView('track');
                        }}
                        className="p-3.5 bg-gradient-to-br from-blue-50 to-indigo-50/60 border border-blue-200/90 rounded-2xl text-left flex flex-col justify-between hover:border-blue-300 hover:shadow-sm transition-all group"
                      >
                        <div className="flex items-center justify-between">
                          <div className="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center text-lg shadow-sm group-hover:scale-105 transition-transform">
                            📋
                          </div>
                          {displayReports.length > 0 && (
                            <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">
                              {displayReports.length} Active
                            </span>
                          )}
                        </div>
                        <div className="mt-2.5">
                          <strong className="text-xs text-slate-900 block font-bold">My Reports & Status</strong>
                          <span className="text-[10px] text-blue-700 font-medium">Track tickets without typing</span>
                        </div>
                      </button>

                      {/* 3. Community Pulse / Feedback */}
                      <button
                        onClick={() => setCurrentView('pulse')}
                        className="p-3.5 bg-gradient-to-br from-amber-50 to-yellow-50/60 border border-amber-200/90 rounded-2xl text-left flex flex-col justify-between hover:border-amber-300 hover:shadow-sm transition-all group"
                      >
                        <div className="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg shadow-sm group-hover:scale-105 transition-transform">
                          💬
                        </div>
                        <div className="mt-2.5">
                          <strong className="text-xs text-slate-900 block font-bold">Community Pulse</strong>
                          <span className="text-[10px] text-amber-800 font-medium">Hall scheduling survey open</span>
                        </div>
                      </button>

                      {/* 4. Amenities Directory */}
                      <button
                        onClick={() => setCurrentView('facilities')}
                        className="p-3.5 bg-gradient-to-br from-slate-50 to-slate-100 border border-slate-200 rounded-2xl text-left flex flex-col justify-between hover:border-slate-300 hover:shadow-sm transition-all group"
                      >
                        <div className="w-9 h-9 rounded-xl bg-slate-800 text-white flex items-center justify-center text-lg shadow-sm group-hover:scale-105 transition-transform">
                          🏛️
                        </div>
                        <div className="mt-2.5">
                          <strong className="text-xs text-slate-900 block font-bold">All Amenities</strong>
                          <span className="text-[10px] text-slate-600 font-medium">Browse 12 facilities</span>
                        </div>
                      </button>
                    </div>
                  </div>

                  {/* ──────────────────────────────────────────────────
                      SECTION: FACILITY CLOSURES & OPERATIONAL NOTICES
                  ────────────────────────────────────────────────── */}
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span>⚠️</span>
                        <span>Facility Notices & Closures</span>
                      </h3>
                      <span className="text-[10px] text-slate-400 font-medium">Live Updates</span>
                    </div>

                    <div className="space-y-2">
                      {OPERATIONAL_NOTICES.map(item => (
                        <div key={item.id} className="p-3 bg-white border border-slate-200 rounded-xl shadow-xs space-y-1">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-1.5">
                              <span className="text-sm">{item.icon}</span>
                              <strong className="text-xs text-slate-900 font-bold">{item.facility}</strong>
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${item.badgeColor}`}>
                              {item.badge}
                            </span>
                          </div>
                          <p className="text-[11px] font-semibold text-slate-800 pl-5">{item.title}</p>
                          <p className="text-[10px] text-slate-500 pl-5">{item.details}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* ──────────────────────────────────────────────────
                      SECTION: UNCLICKABLE FACILITY BOOKING CATALOG
                  ────────────────────────────────────────────────── */}
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span>📅</span>
                        <span>Facility Bookings</span>
                      </h3>
                      <span className="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold border border-slate-200">

                          <div>
                            <strong>Active Work Order:</strong> {trackedReport.maintenance_id}
                            <span className="block text-[10px] text-blue-700">Parts replacement & repair scheduled</span>
                          </div>
                          <span className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                        </div>
                      )}

                      {/* 3-Step Live Timeline */}
                      <div className="pt-2 border-t border-slate-200">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-2">Status Timeline</span>
                        <div className="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                          <div className="p-1.5 bg-white rounded-lg border border-emerald-200 text-emerald-800 font-bold">
                            ✓ Submitted
                          </div>
                          <div className={`p-1.5 rounded-lg border font-bold ${
                            trackedReport.status === 'verified_fault'
                              ? 'bg-white border-emerald-200 text-emerald-800'
                              : 'bg-amber-50 border-amber-300 text-amber-800 animate-pulse'
                          }`}>
                            {trackedReport.status === 'verified_fault' ? '✓ Verified' : '2. In Progress'}
                          </div>
                          <div className={`p-1.5 rounded-lg border ${
                            trackedReport.maintenance_id
                              ? 'bg-white border-blue-200 text-blue-800 font-bold'
                              : 'bg-slate-100 border-slate-200 text-slate-400'
                          }`}>
                            {trackedReport.maintenance_id ? '3. Work Order' : '3. Scheduled'}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 3. Optional Manual Code Search Fallback */}
                  <div className="pt-2 border-t border-slate-100">
                    <span className="text-[10px] font-semibold text-slate-400 block mb-1.5">
                      Or look up by custom ticket reference:
                    </span>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={trackingCode}
                        onChange={e => setTrackingCode(e.target.value)}
                        placeholder="e.g. REP-..."
                        className="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50/50"
                      />
                      <button
                        onClick={() => handleTrackLookup()}
                        disabled={isTracking}
                        className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm transition-colors"
                      >
                        {isTracking ? '...' : 'Lookup'}
                      </button>
                    </div>

                    {trackError && (
                      <div className="p-2.5 mt-2 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700">
                        {trackError}
                      </div>
                    )}
                  </div>

                </div>
              )}

              {/* ────────────────────────────────────────────────────────
                  VIEW: RESIDENT COMMUNITY PULSE / SURVEY
              ──────────────────────────────────────────────────────── */}
              {currentView === 'pulse' && (
                <div className="space-y-4 my-auto">
                  
                  {!pulseSubmitted ? (
                    <div className="space-y-3.5">
                      <div className="text-center">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                          Community Pulse
                        </span>
                        <h2 className="text-base font-bold text-slate-900 mt-2">
                          Community Hall Scheduling
                        </h2>
                        <p className="text-xs text-slate-500 mt-1">
                          Help the management committee optimize opening hours for Building 4 residents.
                        </p>
                      </div>

                      <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl">
                        <h3 className="font-bold text-xs text-slate-800 mb-2.5">
                          How often does the current Community Hall schedule fit your availability?
                        </h3>

                        <div className="space-y-2">
                          {[
                            'Almost always — I can usually book when I need to',
                            'Sometimes — but I often find the slots I want are unavailable',
                            "Rarely — the schedule doesn't match when I'm available",
                            "I haven't tried to use the hall recently"
                          ].map((opt, i) => (
                            <div
                              key={i}
                              onClick={() => setPulseOption(opt)}
                              className={`p-3 rounded-xl border text-xs cursor-pointer transition-all ${
                                pulseOption === opt
                                  ? 'border-emerald-600 bg-emerald-50 text-emerald-950 font-bold shadow-sm'
                                  : 'border-slate-200 bg-white hover:border-slate-300 text-slate-700'
                              }`}
                            >
                              {opt}
                            </div>
                          ))}
                        </div>
                      </div>

                      <button
                        disabled={!pulseOption || pulseSubmitting}
                        onClick={handlePulseSubmit}
                        className={`w-full py-3.5 font-bold text-xs rounded-xl shadow-md transition-all ${
                          pulseOption && !pulseSubmitting
                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        }`}
                      >
                        {pulseSubmitting ? 'Recording Feedback...' : 'Submit Feedback →'}
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3 text-center py-4">
                      <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
                        ✓
                      </div>
                      <h2 className="text-base font-bold text-slate-900">Thank You For Your Feedback!</h2>
                      <p className="text-xs text-slate-500">
                        Your answer has been submitted directly to the township operations planning committee.
                      </p>
                      <button
                        onClick={() => setCurrentView('home')}
                        className="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                      >
                        Return to Homepage
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* ────────────────────────────────────────────────────────
                  VIEW: ALL MONITORED FACILITIES DIRECTORY
              ──────────────────────────────────────────────────────── */}
              {currentView === 'facilities' && (
                <div className="space-y-3">
                  <div>
                    <h2 className="text-base font-bold text-slate-900">Township Facilities ({facilities.length})</h2>
                    <p className="text-xs text-slate-500">Select any facility to report issues or check hours</p>
                  </div>

                  <div className="space-y-2">
                    {facilities.map(fac => (
                      <div
                        key={fac.facility_id}
                        onClick={() => handleSelectFacility(fac)}
                        className={`p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${
                          selectedFacility?.facility_id === fac.facility_id
                            ? 'border-emerald-500 bg-emerald-50/50 shadow-sm'
                            : 'border-slate-200 hover:border-slate-300 bg-white'
                        }`}
                      >
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-xs font-bold text-slate-800">{fac.name}</span>
                            {fac.status === 'maintenance' && (
                              <span className="text-[9px] bg-rose-100 text-rose-700 px-1.5 py-0.2 rounded font-bold">Maintenance</span>
                            )}
                          </div>
                          <p className="text-[10px] text-slate-500 mt-0.5">{fac.location}</p>
                        </div>
                        <span className="text-xs text-emerald-700 font-bold">Select →</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>

            {/* ────────────────────────────────────────────────────────
                MODAL: INTERACTIVE QR SCANNER SIMULATOR
            ──────────────────────────────────────────────────────── */}
            {showQrModal && (
              <div className="absolute inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex flex-col p-5 text-white animate-fade-in">
                <div className="flex items-center justify-between pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📷</span>
                    <strong className="text-sm font-bold">Township QR Scanner</strong>
                  </div>
                  <button
                    onClick={() => setShowQrModal(false)}
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Viewfinder Screen */}
                <div className="flex-1 flex flex-col items-center justify-center">
                  <div className="w-60 h-60 border-2 border-dashed border-emerald-400 rounded-3xl relative flex items-center justify-center overflow-hidden bg-slate-900/60 shadow-2xl">
                    {/* Viewfinder Corners */}
                    <div className="absolute top-2 left-2 w-5 h-5 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                    <div className="absolute top-2 right-2 w-5 h-5 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                    <div className="absolute bottom-2 left-2 w-5 h-5 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                    <div className="absolute bottom-2 right-2 w-5 h-5 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>

                    {/* Animated Scanning Beam */}
                    <div className="absolute left-3 right-3 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_12px_#34d399] scanner-beam"></div>

                    <div className="text-center p-4">
                      <span className="text-3xl block mb-1">📱</span>
                      <p className="text-[11px] text-slate-300 font-medium">Point camera at on-site amenity QR code</p>
                    </div>
                  </div>

                  <p className="text-[11px] text-slate-400 mt-3 text-center">
                    Simulate scanning an amenity QR code below:
                  </p>
                </div>

                {/* Quick Simulation Buttons */}
                <div className="space-y-2 pt-2">
                  <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block text-center">
                    Tap to simulate scan:
                  </span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <button
                      onClick={() => handleSimulateScan('court-badminton-1')}
                      className="p-2.5 bg-emerald-600/90 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors shadow-sm"
                    >
                      <span>🏸</span>
                      <span>Badminton Court 1</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('community-hall-4')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🏛️</span>
                      <span>Community Hall 4</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('court-tennis-1')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🎾</span>
                      <span>Tennis Court 1</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('bbq-pavilion-1')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🍖</span>
                      <span>BBQ Pavilion 1</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Navigation Bar */}
            <nav className="h-14 bg-white border-t border-slate-200 flex items-center justify-around px-2 text-[10px] text-slate-500 shrink-0 select-none">
              
              {/* 1. Home */}
              <button
                onClick={() => setCurrentView('home')}
                className={`flex flex-col items-center gap-0.5 py-1 px-2.5 transition-colors ${
                  currentView === 'home'
                    ? 'text-emerald-700 font-bold'
                    : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">🏠</span>
                <span>Home</span>
              </button>

              {/* 2. Facility / Report */}
              <button
                onClick={() => setCurrentView('facility')}
                className={`flex flex-col items-center gap-0.5 py-1 px-2.5 transition-colors ${
                  currentView === 'facility' || currentView === 'report' || currentView === 'success'
                    ? 'text-emerald-700 font-bold'
                    : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">📍</span>
                <span>Facility</span>
              </button>

              {/* 3. Track Reports (No typing needed) */}
              <button
                onClick={() => {
                  fetchReportsList();
                  setCurrentView('track');
                }}
                className={`flex flex-col items-center gap-0.5 py-1 px-2.5 transition-colors ${
                  currentView === 'track' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">📋</span>
                <span>My Reports</span>
              </button>

              {/* 4. Amenities Directory */}
              <button
                onClick={() => setCurrentView('facilities')}
                className={`flex flex-col items-center gap-0.5 py-1 px-2.5 transition-colors ${
                  currentView === 'facilities' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">🏛️</span>
                <span>Amenities</span>
              </button>

              {/* 5. Community Pulse Survey */}
              <button
                onClick={() => setCurrentView('pulse')}
                className={`flex flex-col items-center gap-0.5 py-1 px-2.5 transition-colors ${
                  currentView === 'pulse' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">💬</span>
                <span>Pulse</span>
              </button>
            </nav>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ResidentApp />);
  </script>
</body>
</html>
