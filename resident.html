  <style>
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 3px; }

    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes scanbeam {
      0% { top: 10%; opacity: 0.8; }
      50% { top: 85%; opacity: 1; }
      100% { top: 10%; opacity: 0.8; }
    }
    .scanner-beam {
      animation: scanbeam 2.2s ease-in-out infinite;
    }
    @keyframes pulse-envelope-arrive {
      0% { opacity: .28; filter: blur(7px) drop-shadow(0 2px 3px rgba(15,23,42,.03)); transform: translate(-118px, -112px) scale(.1) rotate(-7deg); }
      18% { opacity: .42; filter: blur(5.5px) drop-shadow(0 4px 7px rgba(15,23,42,.06)); transform: translate(62px, -88px) scale(.24) rotate(4deg); }
      38% { opacity: .62; filter: blur(3.8px) drop-shadow(0 8px 12px rgba(15,23,42,.1)); transform: translate(88px, -46px) scale(.42) rotate(3deg); }
      57% { opacity: .79; filter: blur(2.4px) drop-shadow(0 11px 17px rgba(15,23,42,.14)); transform: translate(-54px, -24px) scale(.63) rotate(-2.5deg); }
      73% { opacity: .92; filter: blur(1px) drop-shadow(0 15px 22px rgba(15,23,42,.19)); transform: translate(-26px, 7px) scale(.82) rotate(-1.2deg); }
      87% { opacity: 1; filter: blur(0) drop-shadow(0 19px 28px rgba(15,23,42,.25)); transform: translate(16px, -3px) scale(.96) rotate(.7deg); }
      95% { opacity: 1; filter: blur(0) drop-shadow(0 21px 30px rgba(15,23,42,.27)); transform: translate(-2px, 2px) scale(1.025) rotate(-.2deg); }
      100% { opacity: 1; filter: blur(0) drop-shadow(0 18px 27px rgba(15,23,42,.24)); transform: translate(0, 0) scale(1) rotate(0); }
    }
    @keyframes pulse-envelope-wing-left {
      0%, 100% { transform: rotate(-6deg) scaleY(1); }
      50% { transform: rotate(8deg) scaleY(.86); }
    }
    @keyframes pulse-envelope-wing-right {
      0%, 100% { transform: rotate(6deg) scaleY(1); }
      50% { transform: rotate(-8deg) scaleY(.86); }
    }
    @keyframes pulse-envelope-heart-arrive {
      0% { opacity: 0; transform: translate(-86px, -7px) scale(.24); }
      58% { opacity: .8; transform: translate(-18px, -2px) scale(.68); }
      82% { opacity: 1; transform: translate(3px, 0) scale(1.12); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes pulse-envelope-flap {
      0%, 58% { transform: rotateX(0deg); }
      76% { transform: rotateX(-18deg); }
      100% { transform: rotateX(0deg); }
    }
    .pulse-envelope-arrive {
      animation: pulse-envelope-arrive .78s cubic-bezier(.16,.72,.2,1) both;
    }
    .pulse-envelope-flap {
      transform-origin: top center;
      animation: pulse-envelope-flap .6s .14s ease-out both;
    }
    .pulse-envelope-wing-left {
      transform-origin: right center;
      animation: pulse-envelope-wing-left .28s ease-in-out 3;
    }
    .pulse-envelope-wing-right {
      transform-origin: left center;
      animation: pulse-envelope-wing-right .28s ease-in-out 3;
    }
    .pulse-envelope-heart {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-envelope-heart-arrive .5s .18s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes island-glow {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.08); }
    }
    .island-glow-anim {
      animation: island-glow 3s ease-in-out infinite;
    }
    @keyframes fadeInIsland {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeInIsland 0.25s ease-out forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-envelope-arrive, .pulse-envelope-flap, .pulse-envelope-wing-left, .pulse-envelope-wing-right, .pulse-envelope-heart, .island-glow-anim, .animate-fadeIn { animation: none; }

      const mapAmenities = (facilities.length ? facilities : DEFAULT_FACILITIES).map((facility, index) => {

          status: isMaintenance ? 'Under Maintenance' : isBookable ? 'Booking Available' : 'Available',
          tone: isMaintenance ? 'maintenance' : isBookable ? 'booking' : 'available'
        };
      });

      const clampMapOffset = (offset, zoom = mapZoom) => {
        const viewport = mapViewportRef.current;
        const world = mapWorldRef.current;
        if (!viewport || !world) return offset;
        const maxX = Math.max(0, (world.offsetWidth * zoom - viewport.clientWidth) / 2);
        const maxY = Math.max(0, (world.offsetHeight * zoom - viewport.clientHeight) / 2);
        return {
          x: Math.max(-maxX, Math.min(maxX, offset.x)),
          y: Math.max(-maxY, Math.min(maxY, offset.y))
        };
      };
      const changeMapZoom = delta => {
        const nextZoom = Math.min(1.8, Math.max(0.95, mapZoom + delta));
        setMapZoom(nextZoom);
        setMapOffset(offset => clampMapOffset(offset, nextZoom));
      };
      const recenterMap = () => { setMapZoom(1.28); setMapOffset({ x: 0, y: 0 }); setFocusedMapAmenityId(null); };
      const focusMapAmenity = amenity => {
        if (!amenity) return;
        setFocusedMapAmenityId(amenity.id);
        setMapZoom(1.55);
        setMapOffset(clampMapOffset({ x: (50 - amenity.x) * 10.5, y: (50 - amenity.y) * 14 }, 1.55));
      };
      const handleMapSearch = value => {
        setMapSearch(value);
        const query = value.trim().toLowerCase();
        if (query.length < 2) return;
        const exact = mapAmenities.find(item => item.name.toLowerCase() === query);
        const partial = mapAmenities.find(item => item.name.toLowerCase().includes(query));
        focusMapAmenity(exact || partial);
      };
      const beginMapDrag = event => {
        if (event.target.closest('button') || event.target.closest('input') || event.target.closest('[data-map-amenity]')) return;
        mapDrag.current = { x: event.clientX, y: event.clientY, originX: mapOffset.x, originY: mapOffset.y };
        setIsMapDragging(true);
        event.currentTarget.setPointerCapture(event.pointerId);
      };
      const moveMapDrag = event => {
        if (!mapDrag.current) return;
        setMapOffset(clampMapOffset({ x: mapDrag.current.originX + event.clientX - mapDrag.current.x, y: mapDrag.current.originY + event.clientY - mapDrag.current.y }));
      };
      const endMapDrag = () => {
        mapDrag.current = null;
        setIsMapDragging(false);
      };

      useEffect(() => {
        const keepMapInsideViewport = () => setMapOffset(offset => clampMapOffset(offset, mapZoom));
        keepMapInsideViewport();
        const resizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(keepMapInsideViewport) : null;
        if (mapViewportRef.current) resizeObserver?.observe(mapViewportRef.current);
        if (mapWorldRef.current) resizeObserver?.observe(mapWorldRef.current);
        window.addEventListener('resize', keepMapInsideViewport);
        return () => {
          resizeObserver?.disconnect();

        };
      }, [mapZoom, currentView]);
      const openAmenityReport = amenity => {

      // Facility Bookings state & handlers: Dynamically auto-generate 7-day window from current system date
      const generateBookingDays = () => {
        const days = [];
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        for (let i = 0; i < 7; i++) {
          const d = new Date();
          d.setDate(d.getDate() + i);
          const dayName = dayNames[d.getDay()];
          const dateStr = `${d.getDate()} ${monthNames[d.getMonth()]}`;
          const isToday = i === 0;
          const label = isToday ? `${dayName}, ${dateStr} (Today)` : `${dayName}, ${dateStr}`;
          days.push({ label, day: dayName, date: dateStr, isToday });
        }
        return days;
      };

      const BOOKING_DAYS = generateBookingDays();
      const defaultBookingDate = BOOKING_DAYS[0]?.label || 'Today';

      const [bookingModalItem, setBookingModalItem] = useState(null);

      const [bookingSlot, setBookingSlot] = useState('08:00 – 09:00 AM');

      // Check if a time slot has already passed for the selected date
      const isSlotPast = (slotTime, selectedDateLabel) => {
        if (!selectedDateLabel || !selectedDateLabel.includes('(Today)')) {
          return false;
        }
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const match = slotTime.match(/^(\d{1,2}):(\d{2})/);
        if (!match) return false;
        const slotStartHour = parseInt(match[1], 10);
        const slotStartMinute = parseInt(match[2], 10);
        return currentHour > slotStartHour || (currentHour === slotStartHour && currentMinute >= slotStartMinute);
      };

      const getBookingSlotsFor = (id, selectedDate, court = 'Court 1') => {
        let rawSlots = [];

              { time: '21:00 – 22:00 PM', closed: false }

        // 1. Filter out slots that have already passed for today completely
        const activeSlots = rawSlots.filter(s => !isSlotPast(s.time, selectedDate));

      // Get selectable open hours for Custom Time (strictly excludes past & booked times)
      const getAvailableStartHours = (id, selectedDate, court = 'Court 1') => {
        const slots = getBookingSlotsFor(id, selectedDate, court);
        const openSlots = slots.filter(s => !s.closed);
        return openSlots.map(s => {
          const match = s.time.match(/^(\d{1,2}):(\d{2})/);

        const slots = getBookingSlotsFor(item.id, defaultBookingDate, 'Court 1');
        const firstOpen = slots.find(s => !s.closed) || slots[0];

          setBookingSlot(firstOpen.time);

        if (isCustomTime && bookingDate.includes('(Today)')) {
          const now = new Date();
          const [sh, sm] = customStartTime.split(':').map(Number);
          if (sh < now.getHours() || (sh === now.getHours() && sm <= now.getMinutes())) {
            showToast('Custom start time must be later than current time.');
            return;
          }
        }
        const finalSlot = isCustomTime ? `${customStartTime} – ${customEndTime}` : bookingSlot;
        const bookingId = 'bkg-' + Date.now();
        const refId = 'BKG-' + Math.random().toString(36).substring(2, 7).toUpperCase();
        const displayName = bookingModalItem.id === 'book-badminton'

          : bookingModalItem.name;

        const newBooking = {
          id: bookingId,
          facilityId: bookingModalItem.amenityId || bookingModalItem.id,

          facilityName: displayName,
          icon: bookingModalItem.icon,
          rate: bookingModalItem.rate,
          date: bookingDate,
          slot: finalSlot,
          court: bookingModalItem.id === 'book-badminton' ? selectedCourt : null,
          refId,
          status: 'upcoming'
        };

        setUpcomingBookings(prev => [newBooking, ...prev]);
        setMyBookings(prev => ({
          ...prev,
          [bookingModalItem.id]: newBooking

        setBookingModalItem(null);
        showToast(`✓ Booked ${displayName} for ${bookingDate} (${finalSlot})!`);

      const handleRequestCancel = (identifier) => {

      const handleConfirmCancelBooking = () => {
        if (!cancelTargetBooking) return;
        const target = cancelTargetBooking;

        setUpcomingBookings(prev => prev.filter(b => b.id !== target.id));
        setPastBookings(prev => [{
          ...target,
          status: 'cancelled',
          cancelledAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }, ...prev]);

        setMyBookings(prev => {
          const updated = { ...prev };
          delete updated[target.facilityId];
          return updated;
        });

        setCancelTargetBooking(null);
        showToast(`Cancelled reservation for ${target.facilityName}`);
      };

      const fetchReportsList = () => {
        fetch('/api/reports')
          .then(r => r.json())
          .then(data => {
            const list = Array.isArray(data) && data.length > 0 ? data : DEFAULT_REPORTS;
            setAllReports(list);
            if (list.length > 0 && !trackedReport) {
              setTrackedReport(list[0]);
            }
          })
          .catch(() => {
            // Offline/Static fallback (e.g. GitHub Pages)
            setAllReports(DEFAULT_REPORTS);
            if (!trackedReport && DEFAULT_REPORTS.length > 0) {
              setTrackedReport(DEFAULT_REPORTS[0]);
            }
          });
      };

      useEffect(() => {
        // Fetch Facilities (with static fallback if running offline/deployed)
        fetch('/api/facilities')
          .then(r => r.json())
          .then(data => {
            const list = (data.facilities && data.facilities.length > 0) ? data.facilities : DEFAULT_FACILITIES;
            applyLoadedFacilities(list);
          })
          .catch(err => {
            console.log('Backend not detected, activating offline township fallback dataset');
            applyLoadedFacilities(DEFAULT_FACILITIES);
          });

        function applyLoadedFacilities(list) {
          setFacilities(list);
          const paramFacilityId = getQueryParam('facilityId');
          const paramMode = getQueryParam('mode');

          if (paramMode === 'targeted' || paramMode === 'survey' || paramMode === 'pulse') {
            setCurrentView('home');
            setShowPulseInvite(true);
          } else if (paramFacilityId) {
            const found = list.find(f => f.facility_id === paramFacilityId) || list[0];
            setSelectedFacility(found);
            const p = getPresetForCategory('lighting', found);
            setDescription(p.description);
            setLocationDetail(p.location);
            setCurrentView('facility');
          } else {
            const defaultFac = list.find(f => f.facility_id === 'court-badminton-1') || list[0];
            setSelectedFacility(defaultFac);
            const p = getPresetForCategory('lighting', defaultFac);
            setDescription(p.description);
            setLocationDetail(p.location);
            setCurrentView('home'); // Default to the rich Homepage
          }
          setLoading(false);
        }

        fetchReportsList();
      }, []);

      const handleSelectFacility = (fac) => {
        setSelectedFacility(fac);
        const p = getPresetForCategory(category, fac);
        setDescription(p.description);
        setLocationDetail(p.location);
        setCurrentView('facility');
      };

      const handleSimulateScan = (facId) => {
        const found = facilities.find(f => f.facility_id === facId) || facilities[0];

        const p = getPresetForCategory(category, found);
        setDescription(p.description);
        setLocationDetail(p.location);
        setShowQrModal(false);
        setCurrentView('facility');
        showToast(`📍 Scanned: ${found ? found.name : 'Facility QR Code'}`);

      const handleReportSubmit = (e) => {
        e.preventDefault();
        if (!description.trim() || !selectedFacility) return;
        setIsSubmitting(true);

        fetch(`/api/facilities/${selectedFacility.facility_id}/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            category,
            description,
            locationDetail,
            contact
          })
        })
          .then(r => r.json())
          .then(res => {
            setIsSubmitting(false);
            setLastSubmission(res);
            const newId = res.reportId || res.referenceId;
            if (newId) {
              const updated = [newId, ...myReportIds.filter(id => id !== newId)];
              setMyReportIds(updated);
              try {
                localStorage.setItem('resident_my_reports', JSON.stringify(updated));
              } catch (e) {}
            }
            fetchReportsList();
            setCurrentView('success');
            showToast('Fault report submitted to Township Operations');
          })
          .catch(err => {
            setIsSubmitting(false);
            // Offline fallback simulation for static deploy
            const mockId = 'REP-BBR-' + Math.floor(1000 + Math.random() * 9000);
            const mockSubmission = {
              reportId: mockId,
              referenceId: mockId,
              facility_id: selectedFacility.facility_id,
              facility_name: selectedFacility.name,
              category,
              description,
              location_detail: locationDetail,
              contact,
              submitted_at: new Date().toISOString(),
              status: 'unverified'
            };
            setLastSubmission(mockSubmission);
            const updated = [mockId, ...myReportIds.filter(id => id !== mockId)];
            setMyReportIds(updated);
            setAllReports(prev => [mockSubmission, ...prev]);
            try {
              localStorage.setItem('resident_my_reports', JSON.stringify(updated));
            } catch (e) {}
            setCurrentView('success');
            showToast('Fault report submitted (Offline Demo Mode)');
          });
      };

      const handleTrackLookup = (codeToSearch) => {
        const query = (codeToSearch || trackingCode).trim();
        if (!query) return;
        setIsTracking(true);
        setTrackError('');

        fetch('/api/reports')
          .then(r => r.json())
          .then(reports => {
            setIsTracking(false);
            const list = Array.isArray(reports) ? reports : DEFAULT_REPORTS;
            setAllReports(list);
            const match = list.find(r => r.report_id.toLowerCase() === query.toLowerCase());
            if (match) {
              setTrackedReport(match);
            } else {
              setTrackError('No report found matching reference "' + query + '". Please verify the ticket code.');

          .catch(() => {
            setIsTracking(false);
            const match = allReports.find(r => r.report_id.toLowerCase() === query.toLowerCase());

            return r.json();

                                          <div
                                            key={sIdx}
                                            className="px-3 py-2 text-xs text-slate-400 bg-slate-50/90 flex items-center justify-between cursor-not-allowed select-none opacity-60"
                                            title="This time is already booked and unavailable"
                                          >
                                            <span className="font-semibold">{timeVal}</span>
                                            <span className="text-[9px] font-bold bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded">
                                              Booked
                                            </span>
                                          </div>
                                        );
                                      }

                                      return (
                                        <button
                                          type="button"
                                          key={sIdx}
                                          onClick={() => {
                                            setCustomStartTime(timeVal);
                                            const [h, m = 0] = timeVal.split(':').map(Number);
                                            const durMinutes = Math.round(parseFloat(customDuration) * 60);
                                            const totalMinutes = h * 60 + m + durMinutes;
                                            const endH = Math.min(23, Math.floor(totalMinutes / 60));
                                            const endM = totalMinutes % 60;
                                            setCustomEndTime(`${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`);
                                            setIsStartTimeDropdownOpen(false);
                                          }}
                                          className={`w-full px-3 py-2 text-left text-xs font-bold flex items-center justify-between transition-colors ${
                                            customStartTime === timeVal
                                              ? 'bg-emerald-50 text-emerald-950 font-extrabold'
                                              : 'bg-white text-slate-700 hover:bg-slate-50'
                                          }`}
                                        >
                                          <span>{timeVal}</span>
                                          {customStartTime === timeVal ? (
                                            <span className="text-emerald-600 font-bold text-[11px]">✓</span>
                                          ) : (
                                            <span className="text-[9px] text-emerald-600 font-semibold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">
                                              Open
                                            </span>
                                          )}
                                        </button>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>

                              {/* Duration Selector: Flexible Playing Durations */}
                              <div>
                                <label className="text-[10px] text-slate-500 block mb-1 font-bold">Duration</label>
                                <select
                                  value={customDuration}
                                  onChange={e => {
                                    const dur = e.target.value;
                                    setCustomDuration(dur);
                                    const [h, m = 0] = customStartTime.split(':').map(Number);
                                    const durMinutes = Math.round(parseFloat(dur) * 60);
                                    const totalMinutes = h * 60 + m + durMinutes;
                                    const endH = Math.min(23, Math.floor(totalMinutes / 60));
                                    const endM = totalMinutes % 60;
                                    setCustomEndTime(`${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`);
                                  }}
                                  className="w-full p-2.5 border border-slate-300 rounded-lg text-xs font-bold bg-white text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-2xs"
                                >
                                  <option value="0.5">30 Mins (0.5 hr)</option>
                                  <option value="1">1 Hour</option>
                                  <option value="1.5">1.5 Hours</option>
                                  <option value="2">2 Hours</option>
                                  <option value="2.5">2.5 Hours</option>
                                  <option value="3">3 Hours</option>
                                  <option value="3.5">3.5 Hours</option>
                                  <option value="4">4 Hours</option>
                                </select>
                              </div>
                            </div>

                            <div className="p-2.5 bg-white rounded-lg border border-emerald-200 flex items-center justify-between text-xs">
                              <span className="text-[11px] text-slate-500">Selected Reservation:</span>
                              <strong className="text-emerald-800 text-xs font-bold">
                                {customStartTime} – {customEndTime} ({customDuration === '0.5' ? '30 mins' : `${customDuration} hrs`})
                              </strong>
                            </div>
                          </>
                        )}
                      </div>
                    )}
                  </div>

                  {/* Resident Info Box */}
                  <div className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-[11px] flex items-center justify-between">
                    <div>
                      <span className="text-slate-400 block text-[9px]">Booking Resident</span>
                      <strong className="text-slate-800">Resident Li · Unit 4-602</strong>
                    </div>
                    <span className="text-[10px] text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
                      Resident Verified
                    </span>
                  </div>

                  {/* Action Buttons */}
                  <div className="pt-1 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setBookingModalItem(null)}
                      className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmBooking}
                      className="flex-2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all active:scale-[0.99] flex items-center justify-center gap-1.5"
                    >
                      <span>✓</span>
                      <span>Confirm Reservation</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ────────────────────────────────────────────────────────
                MODAL: CONFIRM CANCELLATION DIALOG
            ──────────────────────────────────────────────────────── */}
            {cancelTargetBooking && (
              <div className="absolute inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
                <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl border border-slate-200 text-center space-y-3.5">
                  <div className="w-12 h-12 rounded-full bg-rose-50 border border-rose-200 text-rose-600 flex items-center justify-center text-2xl mx-auto shadow-xs">
                    ⚠️
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-slate-900">
                      {cancelTargetBooking.isCommunityEvent ? 'Leave Activity?' : 'Cancel Reservation?'}
                    </h3>
                    <p className="text-[11px] text-slate-500 mt-0.5">
                      {cancelTargetBooking.isCommunityEvent
                        ? 'Are you sure you want to withdraw your registration for this session?'
                        : 'Are you sure you want to cancel this booking? This reserved slot will be released back to other residents.'}
                    </p>
                  </div>

                  {/* Booking / Activity Details Summary */}
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-left space-y-1.5 text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-lg p-1 bg-white rounded-lg border border-slate-200 shadow-2xs shrink-0">
                        {cancelTargetBooking.icon}
                      </span>
                      <strong className="text-slate-900 text-xs font-bold leading-tight">
                        {cancelTargetBooking.facilityName}
                      </strong>
                    </div>

                    <div className="pt-2 border-t border-slate-200/80 space-y-1 text-[11px]">
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Date:</span>
                        <strong className="text-slate-800">{cancelTargetBooking.date}</strong>
                      </div>
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Time:</span>
                        <strong className="text-emerald-800 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
                          🕒 {cancelTargetBooking.slot}
                        </strong>
                      </div>
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Ref Code:</span>
                        <span className="font-mono text-[10px] text-slate-500">{cancelTargetBooking.refId}</span>
                      </div>
                    </div>
                  </div>

                  {/* Action Buttons: Cancel or Confirm */}
                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setCancelTargetBooking(null)}
                      className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-xs rounded-xl transition-all"
                    >
                      No, Keep
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmCancelBooking}
                      className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold text-xs rounded-xl shadow-md shadow-rose-600/20 transition-all flex items-center justify-center gap-1"
                    >
                      <span>✓</span>
                      <span>{cancelTargetBooking.isCommunityEvent ? 'Confirm Leave' : 'Confirm Cancel'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ────────────────────────────────────────────────────────
                MODAL: JOIN COMMUNITY ACTIVITY CONFIRMATION
            ──────────────────────────────────────────────────────── */}
            {joinTargetActivity && (
              <div className="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
                <div className="bg-white rounded-2xl w-full max-w-xs p-4 shadow-2xl border border-slate-200 text-center space-y-3 animate-scale-up">
                  {/* Warning/Prompt Icon */}
                  <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl mx-auto shadow-inner">
                    {joinTargetActivity.icon}
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-slate-900">Confirm Activity Join?</h3>
                    <p className="text-[11px] text-slate-500 mt-0.5">
                      Are you sure you want to register for this community session?
                    </p>
                  </div>

                  {/* Activity Details Summary */}
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-left space-y-1.5 text-xs">
                    <strong className="text-slate-900 text-xs font-bold leading-tight block">
                      {joinTargetActivity.title}
                    </strong>

                    <div className="pt-2 border-t border-slate-200/80 space-y-1 text-[11px]">
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Time & Date:</span>
                        <strong className="text-emerald-800 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
                          🕒 {joinTargetActivity.time}
                        </strong>
                      </div>
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Location:</span>
                        <span className="font-semibold text-slate-800 text-right max-w-[65%]">📍 {joinTargetActivity.location}</span>
                      </div>
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Organizer:</span>
                        <span className="text-[10px] text-slate-500 text-right max-w-[65%]">{joinTargetActivity.instructor}</span>
                      </div>
                      <div className="flex items-center justify-between text-slate-600">
                        <span className="text-slate-400">Admission:</span>
                        <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.2 rounded">Free for Residents</span>
                      </div>
                    </div>
                  </div>

                  {/* Action Buttons: Cancel or Confirm */}
                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setJoinTargetActivity(null)}
                      className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-xs rounded-xl transition-all"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmJoinActivity}
                      className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-1"
                    >
                      <span>✓</span>
                      <span>Confirm Join</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ────────────────────────────────────────────────────────
                MODAL: INTERACTIVE QR SCANNER SIMULATOR
            ──────────────────────────────────────────────────────── */}
            {showQrModal && (
              <div className="absolute inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex flex-col p-5 text-white animate-fade-in">
                <div className="flex items-center justify-between pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📷</span>
                    <strong className="text-sm font-bold">Township QR Scanner</strong>
                  </div>
                  <button
                    onClick={() => {
                      setShowQrModal(false);
                      setCurrentView('home');
                    }}
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Viewfinder Screen */}
                <div className="flex-1 flex flex-col items-center justify-center">
                  <div className="w-60 h-60 border-2 border-dashed border-emerald-400 rounded-3xl relative flex items-center justify-center overflow-hidden bg-slate-900/60 shadow-2xl">
                    {/* Viewfinder Corners */}
                    <div className="absolute top-2 left-2 w-5 h-5 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                    <div className="absolute top-2 right-2 w-5 h-5 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                    <div className="absolute bottom-2 left-2 w-5 h-5 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                    <div className="absolute bottom-2 right-2 w-5 h-5 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>

                    {/* Animated Scanning Beam */}
                    <div className="absolute left-3 right-3 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_12px_#34d399] scanner-beam"></div>

                    <div className="text-center p-4">
                      <span className="text-3xl block mb-1">📱</span>
                      <p className="text-[11px] text-slate-300 font-medium">Point camera at on-site facility QR code</p>
                    </div>
                  </div>

                  <p className="text-[11px] text-slate-400 mt-3 text-center">
                    Simulate scanning a facility QR code below:
                  </p>
                </div>

                {/* Quick Simulation Buttons */}
                <div className="space-y-2 pt-2">
                  <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block text-center">
                    Tap to simulate scan:
                  </span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <button
                      onClick={() => handleSimulateScan('court-badminton-1')}
                      className="p-2.5 bg-emerald-600/90 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors shadow-sm"
                    >
                      <span>🏸</span>
                      <span>Badminton Court 1</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('community-hall-4')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🏛️</span>
                      <span>Community Hall 4</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('court-tennis-1')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🎾</span>
                      <span>Tennis Court 1</span>
                    </button>
                    <button
                      onClick={() => handleSimulateScan('bbq-pavilion-1')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                    >
                      <span>🍖</span>
                      <span>BBQ Pavilion 1</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Navigation Bar */}
            <nav className="h-16 bg-white border-t border-slate-200 flex items-center justify-around px-2 text-[10px] text-slate-500 shrink-0 select-none">
              
              {/* 1. Home */}
              <button
                onClick={() => setCurrentView('home')}
                className={`flex flex-1 flex-col items-center gap-0.5 py-1 transition-colors ${
                  currentView === 'home'
                    ? 'text-emerald-700 font-bold'
                    : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">🏠</span>
                <span>Home</span>
              </button>

              {/* 2. Track Reports (No typing needed) */}
              <button
                onClick={() => {
                  fetchReportsList();
                  setCurrentView('track');
                }}
                className={`flex flex-1 flex-col items-center gap-0.5 py-1 transition-colors ${
                  currentView === 'track' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">📋</span>
                <span>My Reports</span>
              </button>

              {/* 3. Raised QR scanner action */}
              <button
                type="button"
                aria-label="Open Township QR Scanner"
                title="Open Township QR Scanner"
                onClick={() => {
                  setCurrentView('home');
                  setShowQrModal(true);
                }}
                className={`relative z-10 -mt-5 flex flex-1 flex-col items-center justify-center transition-transform active:scale-95 ${
                  showQrModal || currentView === 'facility' || currentView === 'report' || currentView === 'success' || currentView === 'feedback'
                    ? 'text-violet-700'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <span className="flex h-[4.25rem] w-[4.25rem] items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-sky-500 via-blue-500 to-violet-500 text-white shadow-lg shadow-violet-300/50">
                  <svg aria-hidden="true" viewBox="0 0 32 32" className="h-8 w-8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 4H7a3 3 0 0 0-3 3v3M22 4h3a3 3 0 0 1 3 3v3M4 22v3a3 3 0 0 0 3 3h3M28 22v3a3 3 0 0 1-3 3h-3" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                    <path d="M10 11h4v4h-4zM18 11h4v4h-4zM10 19h4v4h-4zM19 19h3v3h-3zM24 19v2M19 24h2M24 24h1" fill="currentColor" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>
                  </svg>
                </span>
              </button>

              {/* 4. Recommended Activities */}
              <button
                onClick={() => setCurrentView('activities')}
                className={`flex flex-1 flex-col items-center gap-0.5 py-1 transition-colors ${
                  currentView === 'activities' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">🌟</span>
                <span>Activities</span>
              </button>

              {/* 5. Facility Bookings */}
              <button
                onClick={() => setCurrentView('bookings')}
                className={`relative flex flex-1 flex-col items-center gap-0.5 py-1 transition-colors ${
                  currentView === 'bookings' ? 'text-emerald-700 font-bold' : 'hover:text-slate-900'
                }`}
              >
                <span className="text-base">📅</span>
                <span>Booking</span>
                {upcomingBookings.length > 0 && (
                  <span className="absolute top-1 right-5 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
                )}
              </button>
            </nav>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ResidentApp />);
  </script>
</body>
</html>
